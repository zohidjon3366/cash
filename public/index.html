<head>

  <style>
    :root{

    .login-card{background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:36px}.login-card h2{margin:0 0 8px;font-size:28px;color:var(--brand)}.login-card p{margin:0 0 24px;color:var(--muted)}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.field label{font-weight:700;font-size:13px;color:#323b58}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfcff;outline:none;transition:.2s}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(64,63,152,.08)}
    .btn{border:0;border-radius:14px;padding:12px 17px;background:#fff;border:1px solid var(--line);color:var(--brand);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(25,32,70,.10)}.btn.primary{background:linear-gradient(135deg,var(--brand),#31307f);color:#fff;border-color:transparent}.btn.green{background:linear-gradient(135deg,var(--green),#00884b);color:#fff;border-color:transparent}.btn.red{background:linear-gradient(135deg,var(--red),#c91f2a);color:#fff;border-color:transparent}.btn.orange{background:linear-gradient(135deg,var(--orange),#e36f00);color:#fff;border-color:transparent}.btn.full{width:100%;padding:15px}.btn.small{padding:8px 11px;font-size:13px;border-radius:11px}.btn.ghost{background:#f7f8ff}
    .error{padding:12px 14px;border:1px solid #ffd2d6;background:#fff4f5;color:#d51d2a;border-radius:14px;margin-bottom:14px;display:none}.ok{padding:12px 14px;border:1px solid #b9f2d5;background:#effcf5;color:#007947;border-radius:14px;margin-bottom:14px;display:none}
    .app{display:grid;grid-template-columns:286px 1fr;min-height:100vh}.sidebar{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:25px 19px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.side-logo{display:flex;gap:12px;align-items:center;padding:0 4px 20px;border-bottom:1px solid var(--line)}.side-logo img{width:72px;height:auto}.side-logo b{font-size:22px;color:var(--brand);letter-spacing:-.04em}.side-logo span{font-size:12px;color:var(--muted);display:block;margin-top:2px}.menu{display:flex;flex-direction:column;gap:8px}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:14px 15px;border-radius:14px;display:flex;gap:12px;align-items:center;color:#1f2a47;font-weight:800}.menu button.active{background:linear-gradient(135deg,var(--brand),#373587);color:#fff;box-shadow:0 12px 26px rgba(64,63,152,.25)}.menu .ico{width:22px;text-align:center;font-size:18px}.side-user{margin-top:auto;border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;gap:12px;align-items:center;background:#fff}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#eee);display:grid;place-items:center;color:#fff;font-weight:900}.side-user b{display:block}.side-user span{font-size:12px;color:var(--green);font-weight:800}
    .main{padding:28px 32px 44px;min-width:0}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.title h1{margin:0;font-size:34px;line-height:1;color:var(--brand);letter-spacing:-.05em}.title p{margin:8px 0 0;color:var(--muted);font-weight:600}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.select{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:#1f2a47;font-weight:800;outline:none;min-width:170px}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:20px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;display:flex;align-items:center;gap:17px;min-height:130px}.kicon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#e8f9f1;color:var(--green);flex:0 0 auto}.kicon.red{background:#fff0f2;color:var(--red)}.kicon.orange{background:#fff5e7;color:var(--orange)}.kicon.blue{background:#eeefff;color:var(--brand)}.kpi .lab{font-weight:900;color:#212b46;margin-bottom:8px}.kpi .num{font-size:24px;font-weight:950;letter-spacing:-.04em}.kpi .hint{font-size:12px;color:var(--muted);margin-top:8px}.green-text{color:var(--green)!important}.red-text{color:var(--red)!important}.orange-text{color:var(--orange)!important}.brand-text2{color:var(--brand)!important}
    .layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(320px,.95fr);gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.panel-head h3{margin:0;font-size:18px;letter-spacing:-.02em}.panel-body{padding:18px 21px}.search{display:flex;gap:10px;align-items:center}.search input{border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-width:230px;background:#fbfcff;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}.table th{font-size:12px;color:#66708b;background:#fbfcff;text-align:left;padding:13px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:14px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}.table tr:hover td{background:#fbfcff}.company-cell{display:flex;align-items:center;gap:10px;font-weight:900}.mini-logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,rgba(0,168,90,.15),rgba(64,63,152,.15));display:grid;place-items:center;color:var(--brand);font-size:13px;font-weight:900;border:1px solid rgba(64,63,152,.14)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.pill.green{background:#e8f9f1;color:#00864b;border:1px solid #b7efd4}.pill.orange{background:#fff5e7;color:#e36f00;border:1px solid #ffd9a7}.pill.red{background:#fff0f2;color:#d21d29;border:1px solid #ffc7ce}.pill.blue{background:#eeefff;color:var(--brand);border:1px solid #d9dcff}.linkish{border:0;background:transparent;color:var(--brand);font-weight:950;text-decoration:underline;text-underline-offset:3px;padding:0;cursor:pointer}.side-list{display:flex;flex-direction:column;gap:12px}.list-item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f7}.list-item:last-child{border-bottom:0}.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e8f9f1;color:var(--green);font-weight:900}.round.red{background:#fff0f2;color:var(--red)}.round.blue{background:#eeefff;color:var(--brand)}.li-title{font-weight:900}.li-sub{font-size:12px;color:var(--muted);margin-top:3px}.li-amount{text-align:right;font-weight:950}.li-date{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}
    .bottom{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:18px}.chart{height:230px;width:100%}.debt-donut{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--orange) 0 var(--oldPct,60%), var(--red) var(--oldPct,60%) 100%);display:grid;place-items:center;margin:auto;box-shadow:inset 0 0 0 25px #fff}.donut-inner{text-align:center;font-size:12px}.donut-inner b{display:block;font-size:18px;color:var(--brand)}.debt-grid{display:grid;grid-template-columns:1fr 170px 1fr;gap:10px;align-items:center}.debt-side b{display:block;font-size:22px;margin-top:6px}.mini-stat{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px;font-size:13px}
    .page-only{display:none}.page-only.active{display:block}.wide-panel{margin-top:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .span2{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:rgba(9,13,34,.50);backdrop-filter:blur(5px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.28);width:min(780px,96vw);max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;color:var(--brand)}.modal-body{padding:22px 24px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid var(--line);background:#fbfcff}.x{border:0;background:#f3f5fb;border-radius:12px;width:38px;height:38px;font-weight:900;color:var(--brand)}
    .empty{padding:42px;text-align:center;color:var(--muted)}.setup-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-top:18px}.code{background:#0f1733;color:#dfe7ff;border-radius:14px;padding:16px;overflow:auto;font-family:Consolas,monospace;font-size:13px;line-height:1.6}.mobile-top{display:none}.hide{display:none!important}
    @media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr)}.layout,.bottom{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;z-index:15;transition:.2s}.sidebar.open{left:0}.app{grid-template-columns:1fr}.mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.login-wrap{grid-template-columns:1fr;padding:22px}.login-hero{display:none}.main{padding:20px}.topbar{flex-direction:column}.actions{justify-content:flex-start}.grid4{gap:12px}.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}}
    @media(max-width:650px){.grid4{grid-template-columns:1fr}.kpi{min-height:auto}.actions .btn,.actions .select{width:100%}.search{width:100%;flex-direction:column;align-items:stretch}.search input{min-width:0;width:100%}.debt-grid{grid-template-columns:1fr;text-align:center}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="modal-backdrop" id="modalRoot"></div>
<script>
(function(){
'use strict';
const API = '';
const S = { token: localStorage.getItem('afc_token') || '', user:null, dash:null, active:'dashboard', selectedPeriodId:'', search:'' };
const root = document.getElementById('root');
const modalRoot = document.getElementById('modalRoot');

const menus = [
  ['dashboard','▦','Dashboard'], ['companies','▥','Korxonalar'], ['monthly','▤','Oylik jadval'], ['payments','▣','To\'lovlar'],
  ['services','✚','Qo\'shimcha xizmatlar'], ['expenses','⇧','Xarajatlar'], ['debts','◉','Qarzlar'], ['reports','▧','Hisobotlar'], ['settings','⚙','Sozlamalar']
];
const payTypes = ['naqd','plastik karta','Click','Payme','bank o‘tkazmasi','terminal','Uzum','aralash','avans','o‘zaro hisob-kitob'];
const expTypes = ['xodimlar ish haqi','ofis ijarasi','soliq to‘lovlari','bank xizmatlari','reklama','transport','internet va aloqa','server/hosting','kantselyariya','boshqa xarajat'];

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(v){ const x = Number(v||0); return x.toLocaleString('ru-RU', {maximumFractionDigits:0}).replace(/,/g,' '); }
function fmt2(v){ const x = Number(v||0); return x.toLocaleString('ru-RU', {maximumFractionDigits:2}).replace(/,/g,' '); }
function today(){ return new Date().toISOString().slice(0,10); }
function monthNow(){ const d=new Date(); return {year:d.getFullYear(), month:d.getMonth()+1}; }
function statusPill(s){
  const t = String(s||'').toLowerCase();
  const cls = t.includes('toliq') ? 'green' : t.includes('qisman') ? 'orange' : t.includes('berilmagan') ? 'red' : 'blue';
  return `<span class="pill ${cls}">${esc(s||'hisoblanmagan')}</span>`;
}
function moneyClass(v){ return Number(v||0) > 0 ? 'red-text' : 'green-text'; }
function initials(name){ return String(name||'AF').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function periodOptions(selected){
  const periods = (S.dash && S.dash.periods) || [];
  return periods.map(p => `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.period_name)}</option>`).join('');
}
function companyOptions(selected){
  const companies = (S.dash && S.dash.companies) || [];
  return companies.map(c => `<option value="${c.company_id}" ${c.company_id===selected?'selected':''}>${esc(c.company_name)}</option>`).join('');
}
async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const res = await fetch(API + path, Object.assign({}, opts, {headers}));
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.error || 'So‘rov bajarilmadi');
  return data;
}
function setToken(token){ S.token = token || ''; if(token) localStorage.setItem('afc_token', token); else localStorage.removeItem('afc_token'); }

function renderLogin(){
  root.innerHTML = `
  <div class="login-wrap">
    <div class="login-hero">
      <div class="brand-row"><img src="/logo.png" alt="All Finance"><div><div class="brand-text">All Finance</div><div class="brand-sub">Cash platforma</div></div></div>
      <div class="hero-title">ALL FINANCE <span>CASH</span></div>
      <div class="hero-desc">Korxonalar bo‘yicha ish haqi, qo‘shimcha xizmatlar, to‘lovlar, valyuta kursi, xarajatlar, qarzlar va real foyda nazorati uchun alohida platforma.</div>
      <div class="hero-grid">
        <div class="hero-chip"><b>1</b><span>Ish haqi summasi bir marta kiritiladi</span></div>
        <div class="hero-chip"><b>$</b><span>Har to‘lov kunida alohida kurs</span></div>
        <div class="hero-chip"><b>+</b><span>Qo‘shimcha xizmatlar hisobi</span></div>
      </div>
    </div>
    <div class="login-card">
      <div class="brand-row" style="margin-bottom:24px"><img src="/logo.png" alt="All Finance" style="height:52px"><div><div class="brand-text" style="font-size:24px">ALL FINANCE CASH</div><div class="brand-sub">Login orqali kirish</div></div></div>
      <h2>Platformaga kirish</h2><p>Login va parolingizni kiriting.</p>
      <div class="error" id="loginErr"></div>
      <form id="loginForm">
        <div class="field"><label>Login</label><input name="login" autocomplete="username" placeholder="admin" required></div>
        <div class="field"><label>Parol</label><input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <button class="btn primary full" type="submit">Kirish</button>
      </form>
    </div>
  </div>`;
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); const fd = new FormData(e.currentTarget);
    try { const out = await api('/api/auth/login', {method:'POST', body:JSON.stringify(Object.fromEntries(fd))}); setToken(out.token); S.user=out.user; await loadDashboard(); }
    catch(err){ const el=document.getElementById('loginErr'); el.textContent=err.message; el.style.display='block'; }
  });
}

async function loadDashboard(periodId){
  try{
    const q = periodId ? '?period_id=' + encodeURIComponent(periodId) : (S.selectedPeriodId ? '?period_id=' + encodeURIComponent(S.selectedPeriodId) : '');
    S.dash = await api('/api/dashboard' + q);
    if (!S.dash.empty) S.selectedPeriodId = S.dash.selected_period.id;
    renderApp();
  }catch(err){
    if (String(err.message).toLowerCase().includes('token') || String(err.message).includes('Avtorizatsiya')) { setToken(''); renderLogin(); return; }
    root.innerHTML = `<div class="empty"><h2>Xatolik</h2><p>${esc(err.message)}</p><button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div>`;
  }
}

function renderApp(){
  if (!S.token) return renderLogin();
  if (!S.dash || S.dash.empty) return renderEmptyApp();
  root.innerHTML = `
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-logo"><img src="/logo.png" alt="All Finance"><div><b>All Finance</b><span>CASH</span></div></div>
      <nav class="menu">${menus.map(m => `<button class="${S.active===m[0]?'active':''}" data-menu="${m[0]}"><span class="ico">${m[1]}</span>${m[2]}</button>`).join('')}</nav>
      <div class="side-user"><div class="avatar">A</div><div><b>${esc(S.user?.full_name || 'Admin')}</b><span>${esc(S.user?.role || 'Super Admin')}</span></div></div>
    </aside>
    <main class="main">
      <div class="mobile-top"><button class="btn" id="openSide">☰ Menyu</button><img src="/logo.png" style="height:42px"></div>
      <div class="topbar">
        <div class="title"><h1>ALL FINANCE CASH</h1><p>Ish haqi, to‘lov, qo‘shimcha xizmat, xarajat va foyda nazorati</p></div>
        <div class="actions">
          <select class="select" id="periodSelect">${periodOptions(S.selectedPeriodId)}</select>
          <button class="btn ghost" data-action="period">↻ Yangi oy</button>
          <button class="btn green" data-action="payment">＋ To‘lov qo‘shish</button>
          <button class="btn primary" data-action="service">＋ Xizmat qo‘shish</button>
          <button class="btn primary" data-action="expense">⇧ Xarajat qo‘shish</button>
          <button class="btn" data-action="logout">Chiqish</button>
        </div>
      </div>
      ${renderCurrentPage()}
    </main>
  </div>`;
  bindApp();
}

function renderEmptyApp(){
  root.innerHTML = `<div class="empty"><img src="/logo.png" style="height:90px"><h2>ALL FINANCE CASH</h2><p>Hali oy yaratilmagan. Birinchi oyni yarating.</p><button class="btn primary" id="firstPeriod">Yangi oy yaratish</button><button class="btn" id="logout0">Chiqish</button></div>`;
  document.getElementById('firstPeriod').onclick = openPeriodModal;
  document.getElementById('logout0').onclick = () => { setToken(''); renderLogin(); };
}

function bindApp(){
  document.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => { S.active=b.dataset.menu; renderApp(); });
  document.getElementById('openSide')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('periodSelect')?.addEventListener('change', e => loadDashboard(e.target.value));
  document.querySelectorAll('[data-action]').forEach(b => b.onclick = () => handleAction(b.dataset.action));
  document.querySelectorAll('[data-debt]').forEach(b => b.onclick = () => openDebtDetails(b.dataset.debt));
  document.querySelectorAll('[data-salary]').forEach(b => b.onclick = () => openSalaryModal(b.dataset.salary));
  document.querySelectorAll('[data-history]').forEach(b => b.onclick = () => openSalaryHistory(b.dataset.history));
  document.querySelectorAll('[data-company-edit]').forEach(b => b.onclick = () => openCompanyModal(b.dataset.companyEdit));
  const search = document.getElementById('tableSearch'); if(search) search.oninput = e => { S.search=e.target.value; renderApp(); };
}
function handleAction(action){
  if(action==='period') openPeriodModal();
  if(action==='company') openCompanyModal();
  if(action==='payment') openPaymentModal();
  if(action==='service') openServiceModal();
  if(action==='expense') openExpenseModal();
  if(action==='export') window.open('/api/export/json','_blank');
  if(action==='logout'){ setToken(''); renderLogin(); }
}

function renderCurrentPage(){
  const page = S.active;
  if(page==='dashboard') return renderDashboard();
  if(page==='companies') return renderCompaniesPage();
  if(page==='monthly') return renderMonthlyPage();
  if(page==='payments') return renderPaymentsPage();
  if(page==='services') return renderServicesPage();
  if(page==='expenses') return renderExpensesPage();
  if(page==='debts') return renderDebtsPage();
  if(page==='reports') return renderReportsPage();
  if(page==='settings') return renderSettingsPage();
  return renderDashboard();
}
function renderDashboard(){
  const t = S.dash.totals;
  return `
  <section class="grid4">
    ${kpi('↗','Jami hisoblangan',t.total_charged,'so‘m','Ish haqi + qo‘shimcha xizmatlar','green')}
    ${kpi('⇧','Jami xarajat',t.total_expenses,'so‘m','Tanlangan oy bo‘yicha','red')}
    ${kpi('▣','Real foyda',t.real_profit,'so‘m','Tushgan to‘lov - xarajat','green')}
    ${kpi('◉','Jami qarz',t.total_debt,'so‘m','Oldingi + joriy qarz','orange')}
  </section>
  <section class="layout">
    <div>${renderCompanyTable(true)}${renderBottomCharts()}</div>
    <div>${renderLatestPayments()}${renderLatestServices()}${renderLatestExpenses()}</div>
  </section>`;
}
function kpi(icon,label,num,suffix,hint,color){
  const numCls = color==='red'?'red-text':color==='orange'?'orange-text':'green-text';
  return `<div class="kpi"><div class="kicon ${color==='red'?'red':color==='orange'?'orange':'green'}">${icon}</div><div><div class="lab">${label}</div><div class="num ${numCls}">${fmt(num)} <small>${suffix}</small></div><div class="hint">${hint}</div></div></div>`;
}
function filteredCompanies(){
  const q = (S.search||'').toLowerCase().trim();
  let rows = S.dash.companies || [];
  if(q) rows = rows.filter(r => [r.company_name,r.stir,r.director_name,r.phone].join(' ').toLowerCase().includes(q));
  return rows;
}
function renderCompanyTable(compact){
  const rows = filteredCompanies();
  return `<div class="panel">
    <div class="panel-head"><h3>Korxonalar bo‘yicha ish haqi va to‘lovlar holati</h3><div class="search"><input id="tableSearch" value="${esc(S.search)}" placeholder="Qidirish..."><button class="btn small" data-action="company">＋ Korxona</button></div></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Korxona</th><th>STIR</th><th>Rahbar</th><th>Telefon</th><th>Ish haqi</th><th>Qo‘shimcha xizmat</th><th>To‘langan</th><th>Oldingi qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Amal</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td>${esc(r.stir)}</td><td>${esc(r.director_name)}</td><td>${esc(r.phone)}</td><td>${fmt(r.salary_sum)}</td><td><span class="brand-text2">${fmt(r.services_sum)}</span></td><td class="green-text"><b>${fmt(r.paid_sum)}</b></td><td>${r.previous_debt>0?`<button class="linkish orange-text" data-debt="${r.company_id}">${fmt(r.previous_debt)}</button>`:'0'}</td><td class="${moneyClass(r.current_debt)}"><b>${fmt(r.current_debt)}</b></td><td class="${moneyClass(r.total_debt)}"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><button class="btn small" data-salary="${r.company_id}">Maosh</button></td></tr>`).join('') || `<tr><td colspan="13" class="empty">Ma’lumot yo‘q</td></tr>`}
    </tbody></table></div><div class="panel-body" style="padding-top:10px;color:var(--muted)">Jami ${rows.length} ta korxona</div>
  </div>`;
}
function renderBottomCharts(){
  const t=S.dash.totals; const totalDebt=t.total_debt || 1; const oldPct=Math.round((t.old_debt/totalDebt)*100);
  return `<div class="bottom"><div class="panel"><div class="panel-head"><h3>Foyda ko‘rsatkichi</h3><button class="btn small">Oylik</button></div><div class="panel-body">${renderSvgChart()}</div></div><div class="panel"><div class="panel-head"><h3>Qarzlar holati</h3></div><div class="panel-body"><div class="debt-grid"><div class="debt-side">Eski qarz<b class="orange-text">${fmt(t.old_debt)}</b><span>so‘m</span></div><div class="debt-donut" style="--oldPct:${oldPct}%"><div class="donut-inner">Jami qarz<b>${fmt(t.total_debt)}</b>so‘m</div></div><div class="debt-side">Joriy qarz<b class="red-text">${fmt(t.current_debt)}</b><span>so‘m</span></div></div><div class="mini-stat"><span>Eski qarzlar</span><b class="orange-text">${fmt(t.old_debt)} so‘m</b></div><div class="mini-stat"><span>Joriy qarzlar</span><b class="red-text">${fmt(t.current_debt)} so‘m</b></div></div></div></div>`;
}
function renderSvgChart(){
  const chart = S.dash.chart || []; const max = Math.max(1, ...chart.flatMap(x => [x.paid,x.expenses,Math.max(0,x.profit)])); const w=760,h=230,p=35;
  function pts(key){ return chart.map((d,i)=>{ const x=p+i*((w-p*2)/Math.max(1,chart.length-1)); const y=h-p-(Number(d[key]||0)/max)*(h-p*2); return [x,y]; }); }
  function path(a){ return a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '); }
  const p1=pts('paid'), p2=pts('expenses'), p3=pts('profit');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00a85a" stop-opacity=".20"/><stop offset="1" stop-color="#00a85a" stop-opacity="0"/></linearGradient></defs><g stroke="#e6eaf3">${[0,1,2,3].map(i=>`<line x1="${p}" x2="${w-p}" y1="${p+i*(h-p*2)/3}" y2="${p+i*(h-p*2)/3}"/>`).join('')}</g><path d="${path(p1)}" fill="none" stroke="#00a85a" stroke-width="4"/><path d="${path(p2)}" fill="none" stroke="#ef3340" stroke-width="4"/><path d="${path(p3)}" fill="none" stroke="#403f98" stroke-width="4"/>${chart.map((d,i)=>`<text x="${p+i*((w-p*2)/Math.max(1,chart.length-1))}" y="${h-8}" font-size="12" fill="#657089" text-anchor="middle">${esc(d.label)}</text>`).join('')}<g font-size="12" font-weight="700"><text x="${p}" y="18" fill="#00a85a">Tushgan to‘lov</text><text x="160" y="18" fill="#ef3340">Xarajat</text><text x="250" y="18" fill="#403f98">Real foyda</text></g></svg>`;
}
function renderLatestPayments(){ return listPanel('So‘nggi to‘lovlar', S.dash.latest_payments, '↓', 'green', x => esc(x.company_name), x => esc(x.payment_type || 'to‘lov'), x => x.amount_sum, x => x.payment_date); }
function renderLatestServices(){ return listPanel('Qo‘shimcha xizmatlar', S.dash.latest_services, '+', 'blue', x => esc(x.company_name), x => esc(x.service_name), x => x.amount_sum, x => x.service_date); }
function renderLatestExpenses(){ return listPanel('So‘nggi xarajatlar', S.dash.latest_expenses, '↑', 'red', x => esc(x.expense_type), x => esc(x.paid_to || 'xarajat'), x => x.amount_sum, x => x.expense_date); }
function listPanel(title, items, icon, color, titleFn, subFn, amountFn, dateFn){ return `<div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>${title}</h3><button class="btn small">Barchasi</button></div><div class="panel-body"><div class="side-list">${(items||[]).map(x=>`<div class="list-item"><div class="round ${color==='red'?'red':color==='blue'?'blue':''}">${icon}</div><div><div class="li-title">${titleFn(x)}</div><div class="li-sub">${subFn(x)}</div></div><div><div class="li-amount ${color==='red'?'red-text':'green-text'}">${fmt(amountFn(x))} so‘m</div><div class="li-date">${esc(dateFn(x)||'')}</div></div></div>`).join('') || `<div class="empty">Ma’lumot yo‘q</div>`}</div></div></div>`; }

function renderCompaniesPage(){ return `<section class="grid4">${kpi('▥','Korxonalar',S.dash.totals.companies_count,'ta','Faol korxonalar','blue')}${kpi('₮','Jami ish haqi',S.dash.totals.total_salary,'so‘m','Har oy takrorlanadi','green')}${kpi('+','Qo‘shimcha xizmat',S.dash.totals.total_services,'so‘m','Alohida xizmatlar','green')}${kpi('◉','Jami qarz',S.dash.totals.total_debt,'so‘m','Barcha qarzlar','orange')}</section>${renderCompanyTable(false)}`; }
function renderMonthlyPage(){ return renderDashboard(); }
function renderPaymentsPage(){ return `<div class="panel"><div class="panel-head"><h3>To‘lovlar</h3><button class="btn green" data-action="payment">＋ To‘lov qo‘shish</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th></tr></thead><tbody>${(S.dash.latest_payments||[]).map(x=>`<tr><td>${esc(x.payment_date)}</td><td>${esc(x.company_name)}</td><td>${esc(x.payment_type)}</td><td class="green-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">To‘lov yo‘q</td></tr>`}</tbody></table></div></div>`; }
function renderServicesPage(){ return `<div class="panel"><div class="panel-head"><h3>Qo‘shimcha xizmatlar</h3><button class="btn primary" data-action="service">＋ Xizmat qo‘shish</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Xizmat</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th></tr></thead><tbody>${(S.dash.latest_services||[]).map(x=>`<tr><td>${esc(x.service_date)}</td><td>${esc(x.company_name)}</td><td>${esc(x.service_name)}</td><td class="brand-text2"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">Qo‘shimcha xizmat yo‘q</td></tr>`}</tbody></table></div></div>`; }
function renderExpensesPage(){ return `<div class="panel"><div class="panel-head"><h3>Xarajatlar</h3><button class="btn primary" data-action="expense">＋ Xarajat qo‘shish</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Turi</th><th>Kimga</th><th>To‘lov turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th></tr></thead><tbody>${(S.dash.latest_expenses||[]).map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.expense_type)}</td><td>${esc(x.paid_to)}</td><td>${esc(x.payment_type)}</td><td class="red-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">Xarajat yo‘q</td></tr>`}</tbody></table></div></div>`; }
function renderDebtsPage(){ const rows=S.dash.companies.filter(x=>x.total_debt>0); return `<div class="panel"><div class="panel-head"><h3>Qarzlar nazorati</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Korxona</th><th>Oldingi qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Tafsilot</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td class="orange-text"><b>${fmt(r.previous_debt)}</b></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><button class="btn small" data-debt="${r.company_id}">Ko‘rish</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">Qarz yo‘q</td></tr>`}</tbody></table></div></div>`; }
function renderReportsPage(){ const t=S.dash.totals; return `<section class="grid4">${kpi('₮','Hisoblangan foyda',t.calculated_profit,'so‘m','Hisoblangan tushum - xarajat','green')}${kpi('▣','Real foyda',t.real_profit,'so‘m','Tushgan to‘lov - xarajat','green')}${kpi('+','Xizmat tushumi',t.total_services,'so‘m','Qo‘shimcha xizmatlar','blue')}${kpi('◉','Qarzlar',t.total_debt,'so‘m','Undirilmagan summa','orange')}</section>${renderBottomCharts()}`; }
function renderSettingsPage(){ return `<div class="setup-card"><h3>Sozlamalar</h3><p>Ma’lumotlar Supabase bazasida saqlanadi. Tilda sahifasiga faqat iframe qisqa kod qo‘yiladi.</p><button class="btn" data-action="export">JSON backup olish</button><button class="btn red" data-action="logout">Chiqish</button><h4>Tilda qisqa kod namunasi</h4><div class="code">&lt;iframe src="https://YOUR-RENDER-URL.onrender.com" style="width:100%;height:900px;border:0;border-radius:18px;overflow:hidden" loading="lazy"&gt;&lt;/iframe&gt;</div></div>`; }

function openModal(title, body, onSubmit){
  modalRoot.style.display='flex';
  modalRoot.innerHTML = `<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" id="modalClose">×</button></div><form id="modalForm"><div class="modal-body"><div class="error" id="modalErr"></div>${body}</div><div class="modal-foot"><button type="button" class="btn" id="modalCancel">Bekor qilish</button><button type="submit" class="btn primary">Saqlash</button></div></form></div>`;
  const close = () => { modalRoot.style.display='none'; modalRoot.innerHTML=''; };
  document.getElementById('modalClose').onclick=close; document.getElementById('modalCancel').onclick=close;
  document.getElementById('modalForm').onsubmit = async e => {
    e.preventDefault(); const fd=new FormData(e.currentTarget); const obj=Object.fromEntries(fd);
    try{ await onSubmit(obj); close(); await loadDashboard(S.selectedPeriodId); }
    catch(err){ const el=document.getElementById('modalErr'); el.textContent=err.message; el.style.display='block'; }
  };
}
function input(name,label,type='text',value='',req=false,extra=''){ return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${req?'required':''} ${extra}></div>`; }
function select(name,label,options,value=''){ return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`:`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`; }
function textarea(name,label,value=''){ return `<div class="field span2"><label>${label}</label><textarea name="${name}" rows="3">${esc(value)}</textarea></div>`; }
function openPeriodModal(){ const m=monthNow(); openModal('Yangi oy yaratish', `<div class="form-grid">${input('year','Yil','number',m.year,true)}${input('month','Oy raqami','number',m.month,true,'min="1" max="12"')}${input('default_usd_rate','Standart dollar kursi','number','',false,'step="0.01"')}${input('period_name','Davr nomi','text','',false)}</div>`, obj => api('/api/periods',{method:'POST',body:JSON.stringify(obj)})); }
function openCompanyModal(companyId){
  const r = S.dash.companies.find(x=>x.company_id===companyId) || {};
  openModal(companyId?'Korxonani tahrirlash':'Korxona qo‘shish', `<div class="form-grid">${input('name','Korxona nomi','text',r.company_name||'',true)}${input('stir','STIR','text',r.stir||'')}${input('director_name','Rahbar F.I.Sh.','text',r.director_name||'')}${input('phone','Telefon','text',r.phone||'')}${!companyId?input('salary_sum','Oylik ish haqi so‘mda','number','',false,'step="0.01"'):''}${!companyId?input('salary_usd','Oylik ish haqi USD','number','',false,'step="0.01"'):''}${!companyId?input('exchange_rate','Kurs','number','',false,'step="0.01"'):''}${!companyId?input('effective_from','Qaysi sanadan','date',today(),true):''}${textarea('note','Izoh','')}</div>`, obj => companyId ? api('/api/companies/'+companyId,{method:'PUT',body:JSON.stringify(obj)}) : api('/api/companies',{method:'POST',body:JSON.stringify(obj)}));
}
function openSalaryModal(companyId){ const r=S.dash.companies.find(x=>x.company_id===companyId)||{}; openModal('Ish haqi summasini o‘zgartirish', `<p><b>${esc(r.company_name)}</b> uchun yangi summa. Bu o‘zgarish alohida tarixda saqlanadi.</p><div class="form-grid">${input('amount_sum','Yangi summa so‘mda','number',r.salary_sum||'',false,'step="0.01"')}${input('amount_usd','Yangi summa USD','number',r.salary_usd||'',false,'step="0.01"')}${input('exchange_rate','Valyuta kursi','number','',false,'step="0.01"')}${input('effective_from','Qaysi sanadan amal qiladi','date',today(),true)}${textarea('note','O‘zgarish sababi / izohi','')}</div><button type="button" class="btn small" data-history="${companyId}" onclick="return false">Tarix alohida menyuda ko‘riladi</button>`, obj => api('/api/companies/'+companyId+'/salary-rate',{method:'POST',body:JSON.stringify(obj)})); }
function openPaymentModal(){ openModal('To‘lov qo‘shish', `<div class="form-grid"><div class="field"><label>Korxona</label><select name="company_id" required>${companyOptions('')}</select></div><div class="field"><label>Qaysi davr uchun</label><select name="period_id" required>${periodOptions(S.selectedPeriodId)}</select></div>${input('payment_date','To‘lov sanasi','date',today(),true)}${select('payment_type','To‘lov turi',payTypes)}${input('amount_sum','Summa so‘mda','number','',false,'step="0.01"')}${input('amount_usd','Summa USD','number','',false,'step="0.01"')}${input('exchange_rate','To‘lov kunidagi valyuta kursi','number','',false,'step="0.01"')}${select('payment_scope','To‘lov nimaga',['umumiy qarz','joriy oy ish haqi','eski qarz','qo‘shimcha xizmat','avans'])}${textarea('comment','Izoh','')}</div>`, obj => api('/api/payments',{method:'POST',body:JSON.stringify(obj)})); }
function openServiceModal(){ openModal('Qo‘shimcha xizmat qo‘shish', `<div class="form-grid"><div class="field"><label>Korxona</label><select name="company_id" required>${companyOptions('')}</select></div><div class="field"><label>Davr</label><select name="period_id" required>${periodOptions(S.selectedPeriodId)}</select></div>${input('service_date','Xizmat sanasi','date',today(),true)}${input('service_name','Xizmat nomi','text','',true)}${input('amount_sum','Xizmat summasi so‘mda','number','',false,'step="0.01"')}${input('amount_usd','Xizmat summasi USD','number','',false,'step="0.01"')}${input('exchange_rate','Xizmat kunidagi valyuta kursi','number','',false,'step="0.01"')}${textarea('comment','Izoh','')}</div>`, obj => api('/api/services',{method:'POST',body:JSON.stringify(obj)})); }
function openExpenseModal(){ openModal('Xarajat qo‘shish', `<div class="form-grid"><div class="field"><label>Davr</label><select name="period_id" required>${periodOptions(S.selectedPeriodId)}</select></div>${select('expense_type','Xarajat turi',expTypes)}${input('expense_date','Xarajat sanasi','date',today(),true)}${input('paid_to','Kimga to‘landi','text','')}${select('payment_type','To‘lov turi',payTypes)}${input('amount_sum','Summa so‘mda','number','',false,'step="0.01"')}${input('amount_usd','Summa USD','number','',false,'step="0.01"')}${input('exchange_rate','Xarajat kunidagi valyuta kursi','number','',false,'step="0.01"')}${textarea('comment','Izoh','')}</div>`, obj => api('/api/expenses',{method:'POST',body:JSON.stringify(obj)})); }
async function openDebtDetails(companyId){
  try{ const out=await api('/api/companies/'+companyId+'/debt-details?period_id='+encodeURIComponent(S.selectedPeriodId)); const comp=S.dash.companies.find(x=>x.company_id===companyId)||{}; modalRoot.style.display='flex'; modalRoot.innerHTML=`<div class="modal"><div class="modal-head"><h3>Oldingi qarz tafsiloti — ${esc(comp.company_name)}</h3><button class="x" id="modalClose">×</button></div><div class="modal-body"><div class="table-wrap"><table class="table"><thead><tr><th>Davr</th><th>Ish haqi</th><th>Xizmat</th><th>Hisoblangan</th><th>To‘langan</th><th>Qoldiq</th></tr></thead><tbody>${(out.items||[]).map(x=>`<tr><td>${esc(x.period_name)}</td><td>${fmt(x.salary_sum)}</td><td>${fmt(x.services_sum)}</td><td>${fmt(x.charged_sum)}</td><td class="green-text">${fmt(x.paid_sum)}</td><td class="red-text"><b>${fmt(x.debt_sum)}</b></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Oldingi qarz yo‘q</td></tr>`}</tbody></table></div></div><div class="modal-foot"><button class="btn" id="modalCancel">Yopish</button></div></div>`; document.getElementById('modalClose').onclick=document.getElementById('modalCancel').onclick=()=>{modalRoot.style.display='none';modalRoot.innerHTML='';}; } catch(err){ alert(err.message); }
}
async function openSalaryHistory(companyId){ alert('Maosh tarixi API tayyor. Korxona jadvalidagi “Maosh” tugmasi orqali yangi summa kiritiladi va tarixda saqlanadi.'); }

async function boot(){ if(!S.token){ renderLogin(); return; } try{ const me=await api('/api/auth/me'); S.user=me.user; await loadDashboard(); } catch(e){ setToken(''); renderLogin(); } }
boot();
})();
