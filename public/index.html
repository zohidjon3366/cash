async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(S.token)headers.Authorization='Bearer '+S.token;const res=await fetch(API+path,Object.assign({},opts,{headers}));let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||'So‘rov bajarilmadi');return data}
async function downloadAuth(path,filename){const res=await fetch(API+path,{headers:{Authorization:'Bearer '+S.token}});if(!res.ok){let d={};try{d=await res.json()}catch(e){}throw new Error(d.error||'Yuklab olishda xatolik')}const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
function statusPill(s){const t=String(s||'').toLowerCase();const cls=t.includes('toliq')?'green':t.includes('qisman')?'orange':t.includes('berilmagan')?'red':(t.includes('hisoblanmaydi')||t.includes('to‘xtagan')||t.includes('toxtagan'))?'blue':'orange';return `<span class="pill ${cls}">${esc(s||'hisoblanmagan')}</span>`}
function statusLabel(v){const m={active:'Faol',problem:'Muammoli',paused:'Vaqtincha to‘xtagan',no_salary:'Maosh hisoblanmaydi',inactive:'Faol emas',archived:'Arxiv'};return m[String(v||'').toLowerCase()]||v||'Faol'}
function companyStatusPill(s){const v=String(s||'active').toLowerCase();const cls=v==='active'?'green':v==='problem'?'orange':v==='archived'?'red':'blue';return `<span class="pill ${cls}">${esc(statusLabel(v))}</span>`}
function periodStatusPill(r){return r.salary_enabled===false?`<span class="pill blue">Maosh hisoblanmaydi</span>`:`<span class="pill green">Hisoblanadi</span>`}
function kpi(iconName,label,num,suffix,hint,cls='green'){return `<div class="kpi"><div class="kicon ${cls}">${icon(iconName,'lg')}</div><div><div class="lab">${label}</div><div class="num">${typeof num==='number'?fmt(num):esc(num)} ${suffix||''}</div><div class="hint">${hint||''}</div></div></div>`}
function periodOptions(selected){return (S.dash?.periods||[]).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.period_name)}${p.is_closed?' 🔒':''}</option>`).join('')}
function companyOptions(selected){return (S.dash?.companies||[]).map(c=>`<option value="${c.company_id}" ${c.company_id===selected?'selected':''}>${esc(c.company_name)}</option>`).join('')}
function input(name,label,type='text',value='',req=false,extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${req?'required':''} ${extra}></div>`}
function select(name,label,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`:`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function textarea(name,label,value=''){return `<div class="field span2"><label>${label}</label><textarea name="${name}" rows="3">${esc(value)}</textarea></div>`}
function roleBadge(){const r=S.user?.role||'viewer';return r==='admin'?'Super Admin':r==='operator'?'Operator':'Faqat ko‘rish'}
function pageTitle(){return (menus.find(x=>x[0]===S.active)||menus[0])[2]}
function pageSubtitle(){const p=S.dash?.selected_period;const base={dashboard:'Tanlangan davr bo‘yicha joriy tushum, xarajat, foyda va alohida hisobdagi eski qarzlar.',companies:'Korxonalar rekvizitlari, ish haqi va xizmatlar nazorati.',monthly:'Oylik jadval va joriy davr holati.',payments:'To‘lovlar tarixi, valyuta kursi va taqsimotlar.',services:'Qo‘shimcha xizmatlar summasi va hisob-kitobi.',expenses:'Xarajatlar ro‘yxati va foydaga ta’siri.',debts:'Eski qarzlar oylik tushumga kiritilmaydi, alohida hisobda yuritiladi.',initial:'Korxona rekvizitlari, maosh tarixi va davr boshidagi ma’lumotlarni tahrirlash.',reports:'CSV hisobotlar va umumiy tahlillar.',archive:'Arxivlangan korxonalar va barcha o‘zgarishlar snapshoti.',users:'Login, rol va kirish huquqlari.',audit:'O‘zgarishlar tarixi.',settings:'Platforma sozlamalari.'};return (base[S.active]||'Cash Platform')+(p?.is_closed?' <span class="period-lock">'+icon('lock','sm')+' Davr yopilgan</span>':'')}
function renderLogin(){root.innerHTML=`<div class="login-wrap"><div class="login-hero"><div class="brand-row"><img src="/logo.png"><div><div class="brand-text">ALL FINANCE</div><div class="brand-sub">Cash Platform</div></div></div><div class="hero-title">Cash Platform <span>moliyaviy nazorat</span></div><div class="hero-desc">Korxonalar, ish haqi, qo‘shimcha xizmatlar, to‘lovlar, xarajatlar va foydani bitta ixcham panelda nazorat qiling.</div><div class="hero-grid"><div class="hero-chip"><b>${icon('repeat','sm')}</b><span>Ish haqi bir marta kiritilib, har oy takrorlanadi</span></div><div class="hero-chip"><b>${icon('currency','sm')}</b><span>To‘lov kunidagi kurs bilan so‘m va valyuta hisobi</span></div><div class="hero-chip"><b>${icon('check','sm')}</b><span>Qarzlar avtomatik taqsimlanib, tarix saqlanadi</span></div></div></div><div class="login-card"><div class="brand-lockup" style="margin-bottom:22px"><img src="/logo.png"><div><b>Cash Platform</b><span>Login orqali kirish</span></div></div><h2>Platformaga kirish</h2><p>Login va parolingizni kiriting.</p><div class="error" id="loginErr"></div><form id="loginForm"><div class="field"><label>Login</label><input name="login" autocomplete="username" required></div><div class="field"><label>Parol</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">${icon('login','sm')} Kirish</button></form></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const out=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});setToken(out.token);S.user=out.user;await loadDashboard()}catch(err){const el=document.getElementById('loginErr');el.textContent=err.message;el.style.display='block'}}}
async function loadDashboard(periodId){try{const q=periodId?'?period_id='+encodeURIComponent(periodId):(S.dash?.selected_period?.id?'?period_id='+encodeURIComponent(S.dash.selected_period.id):'');S.dash=await api('/api/dashboard'+q);if(!S.dash.empty)S.selectedPeriodId=S.dash.selected_period.id;renderApp()}catch(err){if(String(err.message).toLowerCase().includes('token')||String(err.message).includes('Avtorizatsiya')){setToken('');renderLogin();return}root.innerHTML=`<div class="empty"><h2>Xatolik</h2><p>${esc(err.message)}</p><button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div>`}}
function renderApp(){if(!S.token)return renderLogin();if(!S.dash||S.dash.empty)return renderEmpty();const p=S.dash.selected_period;const m=menus.filter(x=>!x[3]||x[3]===S.user?.role).map(x=>`<button class="${S.active===x[0]?'active':''}" data-menu="${x[0]}"><span class="ico">${icon(x[1],'sm')}</span>${x[2]}</button>`).join('');root.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="side-logo"><img src="/logo.png"><div><b>ALL FINANCE</b><span>Cash Platform</span></div></div><nav class="menu">${m}</nav><div class="side-user"><div class="avatar">${esc(initials(S.user?.full_name||'A'))}</div><div><b>${esc(S.user?.full_name||'Admin')}</b><span>${esc(roleBadge())}</span></div></div></aside><main class="main"><div class="mobile-top"><button class="btn" data-action="toggleSide">${icon('dashboard','sm')} Menyu</button><img src="/logo.png" style="height:38px"></div><div class="topbar"><div class="title"><h1>${esc(pageTitle())}</h1><p>${pageSubtitle()}</p></div><div class="actions"><select class="select" id="periodSelect">${periodOptions(S.selectedPeriodId)}</select>${isAdmin()?`<button class="btn ghost" data-action="period">${icon('calendar','sm')} Yangi oy</button>${p.is_closed?'<button class="btn orange" data-action="reopenPeriod">'+icon('unlock','sm')+' Qayta ochish</button>':'<button class="btn orange" data-action="closePeriod">'+icon('lock','sm')+' Davrni yopish</button>'}`:''}${canWrite()&&!p.is_closed?`<button class="btn green" data-action="payment">${icon('payment','sm')} To‘lov</button><button class="btn primary" data-action="service">${icon('plusSquare','sm')} Xizmat</button><button class="btn blue" data-action="openingDebt">${icon('debt','sm')} Boshlang‘ich qarz</button><button class="btn primary" data-action="expense">${icon('expense','sm')} Xarajat</button>`:''}<button class="btn" data-action="logout">${icon('logout','sm')} Chiqish</button></div></div>${renderCurrentPage()}</main></div>`;bindStatic()}
function renderEmpty(){root.innerHTML=`<div class="empty"><img src="/logo.png" style="height:76px"><h2>Cash Platform</h2><p>Hali oy yaratilmagan. Birinchi oyni yarating.</p>${isAdmin()?'<button class="btn primary" data-action="period">'+icon('calendar','sm')+' Yangi oy yaratish</button>':''}<button class="btn" data-action="logout">'+icon('logout','sm')+' Chiqish</button></div>`;bindStatic()}
function bindStatic(){document.getElementById('periodSelect')?.addEventListener('change',e=>loadDashboard(e.target.value));document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>switchPage(b.dataset.menu));const search=document.getElementById('tableSearch');if(search)search.oninput=e=>{S.search=e.target.value;renderApp()}}
async function switchPage(p){S.active=p;if(p==='users'&&isAdmin())S.users=await api('/api/users');if(p==='audit'&&isAdmin())S.audit=await api('/api/audit-logs');if(p==='archive'&&isAdmin())S.archive=await api('/api/archive');renderApp()}
function renderCurrentPage(){if(S.active==='dashboard')return renderDashboard();if(S.active==='companies')return renderCompaniesPage();if(S.active==='monthly')return renderMonthlyPage();if(S.active==='payments')return renderPaymentsPage();if(S.active==='services')return renderServicesPage();if(S.active==='expenses')return renderExpensesPage();if(S.active==='debts')return renderDebtsPage();if(S.active==='initial')return renderInitialPage();if(S.active==='reports')return renderReportsPage();if(S.active==='archive')return renderArchivePage();if(S.active==='users')return renderUsersPage();if(S.active==='audit')return renderAuditPage();return renderSettingsPage()}

function renderDashboard(){const t=S.dash.totals;const currentPaid=t.total_current_paid??t.total_paid;return `<section class="grid4">${kpi('income','Joriy tushum',currentPaid,'so‘m','Eski qarzsiz, faqat shu oy','green')}${kpi('expense','Jami xarajat',t.total_expenses,'so‘m','Tanlangan oy xarajatlari','red')}${kpi('profit','Real foyda',t.real_profit,'so‘m','Joriy tushum - xarajat','blue')}${kpi('debt','Eski qarz hisobda',t.old_debt,'so‘m','Oylik tushumga kirmaydi','orange')}</section><div class="layout"><div>${renderDashboardTable()}${renderBottomCharts()}</div><div>${renderLatestPayments()}${renderLatestServices()}${renderLatestExpenses()}</div></div>`}

function renderCompaniesPage(){const t=S.dash.totals;const debtCount=(S.dash.companies||[]).filter(x=>x.total_debt>0).length;const okCount=(S.dash.companies||[]).filter(x=>x.total_debt<=0).length;return `<section class="grid4">${kpi('building','Faol korxonalar',t.companies_count,'ta','Ro‘yxatdagi aktivlar','blue')}${kpi('debt','Qarzdorlar',debtCount,'ta','Qoldig‘i bor korxonalar','orange')}${kpi('check','Qarzsiz',okCount,'ta','Qoldig‘i yopilganlar','green')}${kpi('trend','Kutilayotgan tushum',t.expected_income??t.total_debt,'so‘m','Oldingi + joriy','orange')}</section>${renderCompanyDirectory()}`}
function renderCompanyDirectory(){const rows=filterCompanies();return `<div class="panel"><div class="panel-head"><h3>Korxonalar ro‘yxati</h3><div class="search"><input id="tableSearch" placeholder="Nomi, STIR, rahbar yoki telefon..." value="${esc(S.search)}">${isAdmin()?'<button class="btn primary" data-action="company">'+icon('building','sm')+' Korxona qo‘shish</button>':''}<button class="btn" data-action="exportCompaniesCsv">${icon('report','sm')} CSV</button></div></div><div class="table-wrap"><table class="table directory"><thead><tr><th>Korxona</th><th>STIR</th><th>Rahbar</th><th>Telefon</th><th>Holat</th><th>Amal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span><div>${esc(r.company_name)}${r.note?'<span class="subline">'+esc(r.note)+'</span>':''}</div></div></td><td>${esc(r.stir||'')}</td><td>${esc(r.director_name||'')}</td><td>${esc(r.phone||'')}</td><td>${companyStatusPill(r.company_status||'active')}</td><td><div class="row-actions"><button class="btn small" data-card="${r.company_id}">${icon('table','sm')} Kartochka</button>${isAdmin()?`<button class="btn small" data-company-edit="${r.company_id}">${icon('settings','sm')} Edit</button><button class="btn small" data-history="${r.company_id}">${icon('history','sm')} Tarix</button><button class="btn small red" data-company-del="${r.company_id}">${icon('archive','sm')} Arxiv</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Korxona topilmadi</td></tr>`}</tbody></table></div></div>`}

function filterCompanies(){const q=String(S.search||'').toLowerCase();return (S.dash.companies||[]).filter(r=>!q||[r.company_name,r.stir,r.director_name,r.phone].join(' ').toLowerCase().includes(q))}
function renderDashboardTable(){const rows=filterCompanies();return `<div class="panel"><div class="panel-head"><h3>Qisqa korxonalar holati</h3><div class="search"><input id="tableSearch" placeholder="Qidirish..." value="${esc(S.search)}"><button class="btn" data-action="exportMonthlyCsv">${icon('report','sm')} CSV</button></div></div><div class="table-wrap desktop-table"><table class="table compact"><thead><tr><th>Korxona</th><th>Hisoblangan</th><th>Joriy to‘langan</th><th>Eski qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Amal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span><div>${esc(r.company_name)}<span class="subline">${r.service_count?esc(r.service_count)+' ta xizmat':''}</span></div></div></td><td><b>${fmt(r.charged_sum)}</b></td><td class="green-text"><b>${fmt(r.paid_to_current_sum??r.paid_sum)}</b></td><td><button class="linkish orange-text" data-debt="${r.company_id}">${fmt(r.previous_debt)}</button></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}<span class="subline">${r.salary_enabled===false?'Maosh hisoblanmaydi':statusLabel(r.company_status||'active')}</span></td><td><div class="row-actions"><button class="btn small" data-card="${r.company_id}">${icon('table','sm')} Kartochka</button></div></td></tr>`).join('')||`<tr><td colspan="8" class="empty">Korxona topilmadi</td></tr>`}</tbody></table></div><div class="cards-mobile">${rows.map(r=>`<div class="panel-body" style="border-bottom:1px solid var(--line)"><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div><div class="grid4" style="grid-template-columns:repeat(2,1fr);margin:10px 0">${kpi('income','To‘langan',r.paid_sum,'','', 'green')}${kpi('debt','Jami qarz',r.total_debt,'','', 'orange')}</div><button class="btn small" data-card="${r.company_id}">Kartochka</button></div>`).join('')}</div></div>`}
function renderMonthlyPage(){const t=S.dash.totals;const currentPaid=t.total_current_paid??t.total_paid;return `<section class="grid4">${kpi('wallet','Hisoblangan',t.total_charged,'so‘m','Ish haqi + xizmat','blue')}${kpi('income','Joriy to‘langan',currentPaid,'so‘m','Eski qarzsiz','green')}${kpi('debt','Joriy qoldiq',t.current_debt,'so‘m','Shu oy bo‘yicha','orange')}${kpi('profit','Real foyda',t.real_profit,'so‘m','Joriy tushum - xarajat','blue')}</section>${renderMonthlyTable()}`}
function renderMonthlyTable(){const rows=filterCompanies();return `<div class="panel"><div class="panel-head"><h3>Oylik jadval</h3><div class="search"><input id="tableSearch" placeholder="Korxona bo‘yicha qidirish..." value="${esc(S.search)}">${isAdmin()?'<button class="btn primary" data-action="company">'+icon('building','sm')+' Korxona</button>':''}<button class="btn" data-action="exportMonthlyCsv">${icon('report','sm')} CSV</button></div></div><div class="table-wrap desktop-table"><table class="table compact"><thead><tr><th>Korxona</th><th>Davr statusi</th><th>Joriy jami</th><th>Ish haqi</th><th>Xizmat</th><th>Joriy to‘langan</th><th>Eski qarz</th><th>Joriy qarz</th><th>Qoldiq</th><th>Holat</th><th>Amal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span><div>${esc(r.company_name)}<span class="subline">${companyStatusPill(r.company_status||'active')} ${r.period_status_comment?esc(r.period_status_comment):''}</span></div></div></td><td>${periodStatusPill(r)}</td><td><div class="amount-stack"><b>${fmt(r.charged_sum)}</b><small>${r.salary_enabled===false?'faqat xizmat':'oylik xizmat'}</small></div></td><td>${r.salary_enabled===false?'<span class="muted">—</span>':fmt(r.salary_sum)}</td><td class="brand-text2">${fmt(r.services_sum)}</td><td class="green-text"><b>${fmt(r.paid_to_current_sum??r.paid_sum)}</b></td><td><button class="linkish orange-text" data-debt="${r.company_id}">${fmt(r.previous_debt)}</button></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><div class="row-actions mini-actions"><button class="btn small" data-card="${r.company_id}">${icon('table','sm')}</button>${isAdmin()?`<button class="btn small" data-period-status="${r.company_id}">${icon('calendar','sm')}</button><button class="btn small" data-salary="${r.company_id}">${icon('wallet','sm')}</button><button class="btn small" data-history="${r.company_id}">${icon('history','sm')}</button><button class="btn small" data-company-edit="${r.company_id}">${icon('settings','sm')}</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="11" class="empty">Korxona topilmadi</td></tr>`}</tbody></table></div><div class="cards-mobile">${rows.map(r=>`<div class="panel-body" style="border-bottom:1px solid var(--line)"><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div><p class="muted">${statusLabel(r.company_status)} • ${r.salary_enabled===false?'Bu oy maosh hisoblanmaydi':'Maosh hisoblanadi'}</p><div class="grid4" style="grid-template-columns:repeat(2,1fr);margin:10px 0">${kpi('wallet','Joriy jami',r.charged_sum,'','', 'blue')}${kpi('debt','Qoldiq',r.total_debt,'','', 'orange')}</div><button class="btn small" data-card="${r.company_id}">Kartochka</button>${isAdmin()?` <button class="btn small" data-period-status="${r.company_id}">Davr statusi</button>`:''}</div>`).join('')}</div></div>`}
function renderCompanyTable(){return renderMonthlyTable()}

function listPanel(title,rows,iconName,cls,titleFn,subFn,amountFn,dateFn){return `<div class="panel"><div class="panel-head"><h3>${title}</h3></div><div class="panel-body"><div class="side-list">${(rows||[]).map(x=>`<div class="list-item"><div class="round ${cls}">${icon(iconName,'sm')}</div><div><div class="li-title">${titleFn(x)}</div><div class="li-sub">${subFn(x)}</div></div><div><div class="li-amount ${cls==='red'?'red-text':'green-text'}">${fmt(amountFn(x))}</div><div class="li-date">${esc(dateFn(x)||'')}</div></div></div>`).join('')||'<div class="empty">Ma’lumot yo‘q</div>'}</div></div></div>`}
function renderLatestPayments(){return listPanel('So‘nggi to‘lovlar',S.dash.latest_payments,'income','green',x=>esc(x.company_name),x=>esc(x.payment_type||'to‘lov'),x=>x.amount_sum,x=>x.payment_date)}
function renderLatestServices(){return listPanel('Qo‘shimcha xizmatlar',S.dash.latest_services,'plusSquare','blue',x=>esc(x.company_name),x=>esc(x.service_name),x=>x.amount_sum,x=>x.service_date)}
function renderLatestExpenses(){return listPanel('So‘nggi xarajatlar',S.dash.latest_expenses,'expense','red',x=>esc(x.expense_type),x=>esc(x.paid_to||'xarajat'),x=>x.amount_sum,x=>x.expense_date)}
function renderBottomCharts(){const t=S.dash.totals;const expected=t.expected_income??t.current_debt;const debtTotal=t.total_debt||0;return `<div class="bottom"><div class="panel"><div class="panel-head"><h3>Foyda ko‘rsatkichi</h3><button class="btn small" data-action="exportMonthlyCsv">${icon('report','sm')} CSV</button></div><div class="panel-body">${renderProfitChart()}</div></div><div class="panel"><div class="panel-head"><h3>Qarzlar holati</h3></div><div class="panel-body" style="text-align:center;--oldPct:${debtTotal?Math.round((t.old_debt||0)/debtTotal*100):0}%"><div class="summary-strip"><div class="summary-mini"><span>Joriy kutilayotgan</span><b class="red-text">${fmt(expected)}</b></div><div class="summary-mini"><span>Eski qarz hisobda</span><b class="orange-text">${fmt(t.old_debt)}</b></div><div class="summary-mini"><span>Jami qarz</span><b class="orange-text">${fmt(t.total_debt)}</b></div></div><div class="debt-donut"><div class="donut-inner">Hisobdagi qarz<b>${fmt(t.total_debt)}</b>so‘m</div></div>${renderDebtCompanyList()}</div></div></div>`}
function renderProfitChart(){const data=S.dash.chart||[];if(!data.length)return '<div class="empty">Diagramma uchun ma’lumot yo‘q</div>';const max=Math.max(1,...data.flatMap(x=>[Number(x.paid||0),Number(x.expenses||0),Math.abs(Number(x.profit||0))]));return `<div class="chart-legend"><span><i class="legend-dot"></i>Joriy tushum</span><span><i class="legend-dot exp"></i>Xarajat</span><span><i class="legend-dot profit"></i>Real foyda</span></div><div class="profit-bars">${data.map(d=>{const paid=Math.max(0,Number(d.paid||0));const exp=Math.max(0,Number(d.expenses||0));const profit=Number(d.profit||0);const ph=Math.max(3,Math.round(paid/max*100));const eh=Math.max(3,Math.round(exp/max*100));const fh=Math.max(3,Math.round(Math.abs(profit)/max*100));return `<div class="month-group" title="${esc(d.label)}: joriy tushum ${fmt(paid)}, eski qarz undiruvi ${fmt(d.old_collected||0)}, jami kirim ${fmt(d.cash_in||0)}, xarajat ${fmt(exp)}, foyda ${fmt(profit)}"><div class="bars"><span class="bar" style="height:${ph}%"></span><span class="bar exp" style="height:${eh}%"></span><span class="bar profit ${profit<0?'neg':''}" style="height:${fh}%"></span></div><div class="month-label">${esc(d.label)}</div></div>`}).join('')}</div>`}
function renderDebtCompanyList(){const rows=[...(S.dash.companies||[])].filter(x=>Number(x.total_debt||0)>0).sort((a,b)=>b.total_debt-a.total_debt).slice(0,10);return `<div class="debt-list">${rows.map(r=>`<div class="debt-row"><div><b>${esc(r.company_name)}</b><small>Eski: ${fmt(r.previous_debt)} • Joriy: ${fmt(r.current_debt)}</small></div><div class="debt-sum">${fmt(r.total_debt)}<small>so‘m</small></div></div>`).join('')||'<div class="empty">Qarz mavjud emas</div>'}</div>`}
function renderPaymentsPage(){const rows=S.dash.payments||[];return `<div class="panel"><div class="panel-head"><h3>To‘lovlar</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn green" data-action="payment">'+icon('payment','sm')+' To‘lov qo‘shish</button>':''}</div><div class="table-wrap"><table class="table compact"><thead><tr><th>Sana</th><th>Korxona</th><th>Turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Taqsimot</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.payment_date)}</td><td>${esc(x.company_name)}</td><td>${esc(x.payment_type)}</td><td class="green-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.allocation_summary||x.payment_scope||'')}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<div class="row-actions"><button class="btn small" data-payment-copy="${x.id}">${icon('copy','sm')} Nusxa</button><button class="btn small" data-payment-edit="${x.id}">${icon('settings','sm')} Edit</button>${isAdmin()?`<button class="btn small red" data-payment-del="${x.id}">${icon('trash','sm')} O‘chirish</button>`:''}</div>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">To‘lov yo‘q</td></tr>`}</tbody></table></div></div>`}

function renderExpensesPage(){const rows=S.dash.expenses||[];return `<div class="panel"><div class="panel-head"><h3>Xarajatlar</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn primary" data-action="expense">'+icon('expense','sm')+' Xarajat qo‘shish</button>':''}</div><div class="table-wrap"><table class="table compact"><thead><tr><th>Sana</th><th>Turi</th><th>Kimga</th><th>To‘lov turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.expense_type)}</td><td>${esc(x.paid_to)}</td><td>${esc(x.payment_type)}</td><td class="red-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<div class="row-actions"><button class="btn small" data-expense-copy="${x.id}">${icon('copy','sm')} Nusxa</button><button class="btn small" data-expense-edit="${x.id}">${icon('settings','sm')} Edit</button>${isAdmin()?`<button class="btn small red" data-expense-del="${x.id}">${icon('trash','sm')} O‘chirish</button>`:''}</div>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">Xarajat yo‘q</td></tr>`}</tbody></table></div></div>`}

function renderDebtsPage(){const rows=S.dash.companies.filter(x=>x.total_debt>0);const opening=S.dash.opening_debts||[];return `<div class="panel"><div class="panel-head"><h3>Qarzlar nazorati</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn blue" data-action="openingDebt">＋ Davr boshiga qarz</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Korxona</th><th>Davr boshidagi qarz</th><th>Oldingi qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Tafsilot</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td class="brand-text2"><b>${fmt(r.opening_debt_remaining)}</b></td><td class="orange-text"><b>${fmt(r.previous_debt)}</b></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><button class="btn small" data-debt="${r.company_id}">Ko‘rish</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Qarz yo‘q</td></tr>`}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Davr boshiga kiritilgan qarzlar</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${opening.map(x=>`<tr><td>${esc(x.debt_date)}</td><td>${esc(x.company_name)}</td><td class="orange-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<button class="btn small" data-opening-edit="${x.id}">Edit</button> ${isAdmin()?`<button class="btn small red" data-opening-del="${x.id}">O‘chirish</button>`:''}`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">Davr boshidagi qarz yo‘q</td></tr>`}</tbody></table></div></div>`}

function renderInitialPage(){if(!isAdmin())return '<div class="empty">Ruxsat yo‘q</div>';const rows=S.dash.companies||[];const opening=S.dash.opening_debts||[];return `<section class="grid4">${kpi('building','Faol korxonalar',rows.length,'ta','Boshlang‘ich rekvizitlar','blue')}${kpi('wallet','Jami maosh',S.dash.totals.total_salary,'so‘m','Amaldagi oylik summa','green')}${kpi('debt','Davr boshidagi qarz',S.dash.totals.total_opening_debt,'so‘m','Tanlangan davr','orange')}${kpi('history','Arxiv nazorati','100%','','Har bir o‘zgarish qayd qilinadi','blue')}</section><div class="panel"><div class="panel-head"><h3>Korxona boshlang‘ich ma’lumotlari</h3><button class="btn primary" data-action="company">＋ Korxona</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Korxona</th><th>STIR</th><th>Rahbar</th><th>Telefon</th><th>Status</th><th>Amaldagi maosh</th><th>Qaysi sanadan</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td>${esc(r.stir||'')}</td><td>${esc(r.director_name||'')}</td><td>${esc(r.phone||'')}</td><td>${companyStatusPill(r.company_status||'active')}</td><td><b>${r.salary_enabled===false?'<span class="muted">hisoblanmaydi</span>':fmt(r.salary_sum)}</b></td><td>${esc(r.salary_effective_from||'')}</td><td>${esc(r.note||'')}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-company-edit="${r.company_id}">Rekvizit</button><button class="btn small" data-salary="${r.company_id}">Maosh</button><button class="btn small" data-period-status="${r.company_id}">Davr statusi</button><button class="btn small" data-history="${r.company_id}">Maosh tarixi</button><button class="btn small red" data-company-del="${r.company_id}">Arxiv</button></div></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Korxona yo‘q</td></tr>`}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Davr boshidagi qarzlarni tahrirlash</h3>${!S.dash.selected_period.is_closed?'<button class="btn blue" data-action="openingDebt">＋ Boshlang‘ich qarz</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${opening.map(x=>`<tr><td>${esc(x.debt_date)}</td><td>${esc(x.company_name)}</td><td class="orange-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td><button class="btn small" data-opening-edit="${x.id}">Edit</button> <button class="btn small red" data-opening-del="${x.id}">O‘chirish</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Davr boshidagi qarz yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderArchivePage(){if(!isAdmin())return '<div class="empty">Ruxsat yo‘q</div>';const a=S.archive||{archived_companies:[],records:[],logs:[]};return `<section class="grid4">${kpi('building','Arxivdagi korxonalar',a.archived_companies.length,'ta','Tiklash yoki tahrirlash mumkin','orange')}${kpi('history','Arxiv yozuvlari',a.records.length,'ta','Snapshotlar','blue')}${kpi('report','Audit log',a.logs.length,'ta','Harakatlar tarixi','green')}${kpi('lock','Xavfsizlik','ON','','O‘zgarishlar qayd qilinadi','blue')}</section><div class="panel"><div class="panel-head"><h3>Arxivdagi korxonalar</h3><button class="btn" data-action="refreshArchive">Yangilash</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Korxona</th><th>STIR</th><th>Rahbar</th><th>Telefon</th><th>Status</th><th>Yangilangan</th><th>Amal</th></tr></thead><tbody>${a.archived_companies.map(c=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(c.name)}</span>${esc(c.name)}</div></td><td>${esc(c.stir||'')}</td><td>${esc(c.director_name||'')}</td><td>${esc(c.phone||'')}</td><td>${esc(c.status)}</td><td>${esc(String(c.updated_at||'').slice(0,16).replace('T',' '))}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-company-edit="${c.id}">Edit</button><button class="btn small green" data-company-restore="${c.id}">Tiklash</button><button class="btn small red" data-company-hard-delete="${c.id}">Butunlay o‘chirish</button></div></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Arxivda korxona yo‘q</td></tr>`}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Barcha o‘zgarishlar arxivi</h3><button class="btn" data-action="refreshArchive">Yangilash</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Vaqt</th><th>User</th><th>Action</th><th>Jadval</th><th>Izoh</th><th>Ko‘rish</th></tr></thead><tbody>${a.records.map(x=>`<tr><td>${esc(String(x.created_at||'').slice(0,19).replace('T',' ' function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'){if(q&&nx==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[]}else cell+=ch}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);const head=(rows.shift()||[]).map(x=>x.trim());return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}
async function importCompanies(){const input=document.getElementById('csvFile');const out=document.getElementById('importResult');if(!input?.files?.[0]){alert('CSV fayl tanlang');return}const text=await input.files[0].text();const rows=parseCSV(text);try{const res=await api('/api/import/companies',{method:'POST',body:JSON.stringify({period_id:S.selectedPeriodId,rows})});out.textContent=`Import tugadi: yangi ${res.created}, yangilangan ${res.updated}, maosh ${res.salary_rates}, davr boshidagi qarz ${res.opening_debts}, xato ${res.errors.length}`;await loadDashboard(S.selectedPeriodId)}catch(err){out.textContent=err.message}}
async function handleAction(action){try{if(action==='toggleSide')document.getElementById('sidebar')?.classList.toggle('open');if(action==='period')openPeriodModal();if(action==='company')openCompanyModal();if(action==='payment')openPaymentModal();if(action==='service')openServiceModal();if(action==='expense')openExpenseModal();if(action==='openingDebt')openOpeningDebtModal();if(action==='user')openUserModal();if(action==='logout'){setToken('');renderLogin()}if(action==='exportJson')exportJson();if(action==='exportMonthlyCsv')downloadAuth('/api/export/monthly.csv?period_id='+encodeURIComponent(S.selectedPeriodId),'all_finance_cash_monthly.csv');if(action==='exportCompaniesCsv')downloadAuth('/api/export/companies.csv','all_finance_cash_companies.csv');if(action==='importCompanies')importCompanies();if(action==='closePeriod'&&confirm('Davr yopilsinmi? Yopilgan davrga o‘zgartirish kiritib bo‘lmaydi.')){await api('/api/periods/'+S.selectedPeriodId+'/close',{method:'PUT'});await loadDashboard(S.selectedPeriodId)}if(action==='reopenPeriod'&&confirm('Davr qayta ochilsinmi?')){await api('/api/periods/'+S.selectedPeriodId+'/reopen',{method:'PUT'});await loadDashboard(S.selectedPeriodId)}if(action==='refreshAudit'){S.audit=await api('/api/audit-logs');renderApp()}if(action==='refreshArchive'){S.archive=await api('/api/archive');renderApp()}}catch(err){alert(err.message)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)return handleAction(b.dataset.action);if(b.dataset.card)return openCompanyCard(b.dataset.card);if(b.dataset.debt)return openDebtDetails(b.dataset.debt);if(b.dataset.salary)return openSalaryModal(b.dataset.salary);if(b.dataset.periodStatus)return openPeriodStatusModal(b.dataset.periodStatus);if(b.dataset.history)return openSalaryHistory(b.dataset.history);if(b.dataset.companyEdit)return openCompanyModal(b.dataset.companyEdit);if(b.dataset.companyDel)return deleteRecord('companies',b.dataset.companyDel,'Korxonani arxivga o‘tkazaymi?');if(b.dataset.paymentCopy)return openPaymentModal(b.dataset.paymentCopy,true);if(b.dataset.paymentEdit)return openPaymentModal(b.dataset.paymentEdit);if(b.dataset.paymentDel)return deleteRecord('payments',b.dataset.paymentDel,'To‘lovni o‘chiraymi?');if(b.dataset.serviceEdit)return openServiceModal(b.dataset.serviceEdit);if(b.dataset.serviceDel)return deleteRecord('services',b.dataset.serviceDel,'Qo‘shimcha xizmatni o‘chiraymi?');if(b.dataset.expenseCopy)return openExpenseModal(b.dataset.expenseCopy,true);if(b.dataset.expenseEdit)return openExpenseModal(b.dataset.expenseEdit);if(b.dataset.expenseDel)return deleteRecord('expenses',b.dataset.expenseDel,'Xarajatni o‘chiraymi?');if(b.dataset.openingEdit)return openOpeningDebtModal(b.dataset.openingEdit);if(b.dataset.openingDel)return deleteRecord('opening-debts',b.dataset.openingDel,'Davr boshidagi qarzni o‘chiraymi?');if(b.dataset.userEdit)return openUserModal(b.dataset.userEdit);if(b.dataset.salaryRateEdit)return openSalaryRateModal(b.dataset.salaryRateEdit);if(b.dataset.salaryRateDel)return deleteSalaryRate(b.dataset.salaryRateDel);if(b.dataset.companyRestore)return restoreCompany(b.dataset.companyRestore);if(b.dataset.companyHardDelete)return hardDeleteCompany(b.dataset.companyHardDelete);if(b.dataset.archiveView)return openArchiveRecord(b.dataset.archiveView)});
async function boot(){if(!S.token){renderLogin();return}try{const me=await api('/api/auth/me');S.user=me.user;await loadDashboard()}catch(e){setToken('');renderLogin()}}
boot();
})();
