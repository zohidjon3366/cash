<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALL FINANCE CASH</title>
  <style>
    :root{--brand:#403f98;--brand2:#5250b7;--green:#00a85a;--red:#ef3340;--orange:#ff8a00;--blue:#2775ff;--text:#0f1733;--muted:#657089;--bg:#f6f8fc;--card:#fff;--line:#e7eaf3;--shadow:0 18px 45px rgba(25,32,70,.08);--radius:18px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(64,63,152,.11),transparent 30%),linear-gradient(180deg,#fbfcff,#f4f7fb)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:48px;gap:38px;overflow:hidden}.login-hero{position:relative;padding:54px;border-radius:34px;background:linear-gradient(135deg,#fff,rgba(255,255,255,.80));box-shadow:var(--shadow);min-height:560px;border:1px solid rgba(64,63,152,.08)}.login-hero:before{content:"";position:absolute;inset:auto -110px -120px auto;width:420px;height:420px;border-radius:50%;background:linear-gradient(135deg,rgba(0,168,90,.20),rgba(64,63,152,.18));filter:blur(2px)}.brand-row{display:flex;align-items:center;gap:18px}.brand-row img{height:64px;width:auto}.brand-text{font-weight:950;color:var(--brand);font-size:30px;letter-spacing:-.04em}.brand-sub{color:var(--muted);font-size:15px;margin-top:6px}.hero-title{font-size:54px;line-height:1.05;letter-spacing:-.06em;margin:70px 0 22px;color:var(--brand)}.hero-title span{color:var(--green)}.hero-desc{font-size:18px;line-height:1.7;color:var(--muted);max-width:720px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}.hero-chip{padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 25px rgba(20,30,80,.05)}.hero-chip b{display:block;color:var(--brand);font-size:20px}.hero-chip span{font-size:13px;color:var(--muted)}.login-card{background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:36px}.login-card h2{margin:0 0 8px;font-size:28px;color:var(--brand)}.login-card p{margin:0 0 24px;color:var(--muted)}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.field label{font-weight:800;font-size:13px;color:#323b58}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfcff;outline:none;transition:.2s}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(64,63,152,.08)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.span2{grid-column:1/-1}.muted{color:var(--muted)}
    .btn{border:0;border-radius:14px;padding:12px 17px;background:#fff;border:1px solid var(--line);color:var(--brand);font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(25,32,70,.10)}.btn.primary{background:linear-gradient(135deg,var(--brand),#31307f);color:#fff;border-color:transparent}.btn.green{background:linear-gradient(135deg,var(--green),#00884b);color:#fff;border-color:transparent}.btn.red{background:linear-gradient(135deg,var(--red),#c91f2a);color:#fff;border-color:transparent}.btn.orange{background:linear-gradient(135deg,var(--orange),#e36f00);color:#fff;border-color:transparent}.btn.blue{background:linear-gradient(135deg,var(--blue),#1455cd);color:#fff;border-color:transparent}.btn.full{width:100%;padding:15px}.btn.small{padding:8px 11px;font-size:13px;border-radius:11px}.btn.ghost{background:#f7f8ff}.btn:disabled{opacity:.5;cursor:not-allowed}.error{padding:12px 14px;border:1px solid #ffd2d6;background:#fff4f5;color:#d51d2a;border-radius:14px;margin-bottom:14px;display:none}.ok{padding:12px 14px;border:1px solid #b9f2d5;background:#effcf5;color:#007947;border-radius:14px;margin-bottom:14px;display:none}
    .app{display:grid;grid-template-columns:286px 1fr;min-height:100vh}.sidebar{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:25px 19px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;z-index:20}.side-logo{display:flex;gap:12px;align-items:center;padding:0 4px 20px;border-bottom:1px solid var(--line)}.side-logo img{width:72px;height:auto}.side-logo b{font-size:22px;color:var(--brand);letter-spacing:-.04em}.side-logo span{font-size:12px;color:var(--muted);display:block;margin-top:2px}.menu{display:flex;flex-direction:column;gap:8px;overflow:auto}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:14px 15px;border-radius:14px;display:flex;gap:12px;align-items:center;color:#1f2a47;font-weight:850}.menu button.active{background:linear-gradient(135deg,var(--brand),#373587);color:#fff;box-shadow:0 12px 26px rgba(64,63,152,.25)}.menu .ico{width:22px;text-align:center;font-size:18px}.side-user{margin-top:auto;border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;gap:12px;align-items:center;background:#fff}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#eee);display:grid;place-items:center;color:#fff;font-weight:950}.side-user b{display:block}.side-user span{font-size:12px;color:var(--green);font-weight:850}
    .main{padding:28px 32px 44px;min-width:0}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.title h1{margin:0;font-size:34px;line-height:1;color:var(--brand);letter-spacing:-.05em}.title p{margin:8px 0 0;color:var(--muted);font-weight:600}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.select{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:#1f2a47;font-weight:850;outline:none;min-width:170px}.mobile-top{display:none}.period-lock{display:inline-flex;align-items:center;gap:8px;padding:10px 13px;border-radius:999px;background:#fff5e7;color:#ce6500;border:1px solid #ffd8a5;font-weight:900}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:20px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;display:flex;align-items:center;gap:17px;min-height:130px}.kicon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#e8f9f1;color:var(--green);flex:0 0 auto}.kicon.red{background:#fff0f2;color:var(--red)}.kicon.orange{background:#fff5e7;color:var(--orange)}.kicon.blue{background:#eeefff;color:var(--brand)}.kpi .lab{font-weight:950;color:#212b46;margin-bottom:8px}.kpi .num{font-size:24px;font-weight:950;letter-spacing:-.04em}.kpi .hint{font-size:12px;color:var(--muted);margin-top:8px}.green-text{color:var(--green)!important}.red-text{color:var(--red)!important}.orange-text{color:var(--orange)!important}.brand-text2{color:var(--brand)!important}
    .layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(320px,.95fr);gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.panel-head{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.panel-head h3{margin:0;font-size:18px;letter-spacing:-.02em}.panel-body{padding:18px 21px}.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search input{border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-width:230px;background:#fbfcff;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}.table th{font-size:12px;color:#66708b;background:#fbfcff;text-align:left;padding:13px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:14px 13px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}.table tr:hover td{background:#fbfcff}.company-cell{display:flex;align-items:center;gap:10px;font-weight:950}.mini-logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,rgba(0,168,90,.15),rgba(64,63,152,.15));display:grid;place-items:center;color:var(--brand);font-size:13px;font-weight:950;border:1px solid rgba(64,63,152,.14)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.pill.green{background:#e8f9f1;color:#00864b;border:1px solid #b7efd4}.pill.orange{background:#fff5e7;color:#e36f00;border:1px solid #ffd9a7}.pill.red{background:#fff0f2;color:#d21d29;border:1px solid #ffc7ce}.pill.blue{background:#eeefff;color:var(--brand);border:1px solid #d9dcff}.linkish{border:0;background:transparent;color:var(--brand);font-weight:950;text-decoration:underline;text-underline-offset:3px;padding:0;cursor:pointer}.side-list{display:flex;flex-direction:column;gap:12px}.list-item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f7}.list-item:last-child{border-bottom:0}.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e8f9f1;color:var(--green);font-weight:950}.round.red{background:#fff0f2;color:var(--red)}.round.blue{background:#eeefff;color:var(--brand)}.li-title{font-weight:950}.li-sub{font-size:12px;color:var(--muted);margin-top:3px}.li-amount{text-align:right;font-weight:950}.li-date{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}.bottom{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:18px}.chart{height:230px;width:100%}.debt-donut{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--orange) 0 var(--oldPct,60%), var(--red) var(--oldPct,60%) 100%);display:grid;place-items:center;margin:auto;box-shadow:inset 0 0 0 25px #fff}.donut-inner{text-align:center;font-size:12px}.donut-inner b{display:block;font-size:18px;color:var(--text)}.empty{padding:44px;text-align:center;color:var(--muted)}.empty h2{color:var(--brand)}.setup-card{max-width:920px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}.code{background:#0f1733;color:#dce3ff;padding:16px;border-radius:14px;overflow:auto;margin-top:10px}.file{border:1px dashed var(--brand);border-radius:14px;padding:18px;background:#f7f8ff;margin-top:10px}.cards-mobile{display:none}
    .modal-wrap{position:fixed;inset:0;background:rgba(8,13,35,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.modal{background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.20);width:min(1050px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);gap:14px}.modal-head h3{margin:0;color:var(--brand);letter-spacing:-.03em}.modal-body{padding:22px 24px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 24px;border-top:1px solid var(--line);background:#fbfcff}.x{border:0;background:#f2f3f8;border-radius:50%;width:36px;height:36px;font-size:22px;color:#4d5570}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:9px 12px;border-radius:999px;background:#f7f8ff;border:1px solid var(--line);font-weight:900;color:var(--brand)}
    @media(max-width:1100px){.login-wrap{grid-template-columns:1fr}.login-hero{min-height:auto}.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-310px;transition:.25s}.sidebar.open{left:0}.main{padding:18px}.mobile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.topbar{flex-direction:column}.grid4{grid-template-columns:repeat(2,1fr)}.layout,.bottom{grid-template-columns:1fr}.hero-grid{grid-template-columns:1fr}.login-wrap{padding:22px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.table{min-width:760px}.cards-mobile{display:grid;gap:12px}.desktop-table{display:none}}@media(max-width:640px){.grid4{grid-template-columns:1fr}.actions{justify-content:flex-start}.title h1{font-size:28px}.kpi{min-height:auto}.login-hero{padding:28px}.hero-title{font-size:38px}.login-card{padding:24px}.modal-wrap{padding:8px}.modal-body{padding:16px}.modal-head{padding:16px}.modal-foot{padding:14px}.table{font-size:13px}}

<body>
<div id="root"></div>
<div id="modalRoot" class="modal-wrap"></div>
<script>
(()=>{
const API='';
const root=document.getElementById('root');
const modalRoot=document.getElementById('modalRoot');
const menus=[['dashboard','▦','Dashboard'],['companies','▥','Korxonalar'],['monthly','▤','Oylik jadval'],['payments','↓','To‘lovlar'],['services','+','Xizmatlar'],['expenses','↑','Xarajatlar'],['debts','◉','Qarzlar'],['reports','▧','Hisobotlar'],['users','☷','Foydalanuvchilar','admin'],['audit','◌','Audit log','admin'],['settings','⚙','Sozlamalar']];
const payTypes=['naqd','plastik karta','Click','Payme','bank o‘tkazmasi','terminal','Uzum','aralash','avans','o‘zaro hisob-kitob'];
const payScopes=['avval eski qarzlar, keyin joriy oy','faqat tanlangan davr','joriy oy ish haqi','eski qarz','qo‘shimcha xizmat','avans'];
const expTypes=['xodimlar ish haqi','ofis ijarasi','soliq to‘lovlari','bank xizmatlari','reklama','transport','internet va aloqa','server/hosting','kantselyariya','boshqa xarajat'];
const S={token:localStorage.getItem('afc_token')||'',user:null,dash:null,active:'dashboard',search:'',users:null,audit:null};
function isAdmin(){return S.user?.role==='admin'}function canWrite(){return ['admin','operator'].includes(S.user?.role)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v){return Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:0}).replace(/,/g,' ')}function fmt2(v){return Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2}).replace(/,/g,' ')}
function today(){return new Date().toISOString().slice(0,10)}function monthStart(){const p=S.dash?.selected_period;if(p)return `${p.year}-${String(p.month).padStart(2,'0')}-01`;return today()}function initials(name){return String(name||'AF').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function setToken(token){S.token=token||'';if(token)localStorage.setItem('afc_token',token);else localStorage.removeItem('afc_token')}
async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(S.token)headers.Authorization='Bearer '+S.token;const res=await fetch(API+path,Object.assign({},opts,{headers}));let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||'So‘rov bajarilmadi');return data}
async function downloadAuth(path,filename){const res=await fetch(API+path,{headers:{Authorization:'Bearer '+S.token}});if(!res.ok){let d={};try{d=await res.json()}catch(e){}throw new Error(d.error||'Yuklab olishda xatolik')}const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
function statusPill(s){const t=String(s||'').toLowerCase();const cls=t.includes('toliq')?'green':t.includes('qisman')?'orange':t.includes('berilmagan')?'red':'blue';return `<span class="pill ${cls}">${esc(s||'hisoblanmagan')}</span>`}
function kpi(icon,label,num,suffix,hint,cls='green'){return `<div class="kpi"><div class="kicon ${cls}">${icon}</div><div><div class="lab">${label}</div><div class="num">${typeof num==='number'?fmt(num):esc(num)} ${suffix||''}</div><div class="hint">${hint||''}</div></div></div>`}
function periodOptions(selected){return (S.dash?.periods||[]).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.period_name)}${p.is_closed?' 🔒':''}</option>`).join('')}
function companyOptions(selected){return (S.dash?.companies||[]).map(c=>`<option value="${c.company_id}" ${c.company_id===selected?'selected':''}>${esc(c.company_name)}</option>`).join('')}
function input(name,label,type='text',value='',req=false,extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${req?'required':''} ${extra}></div>`}
function select(name,label,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`:`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function textarea(name,label,value=''){return `<div class="field span2"><label>${label}</label><textarea name="${name}" rows="3">${esc(value)}</textarea></div>`}
function roleBadge(){const r=S.user?.role||'viewer';return r==='admin'?'Super Admin':r==='operator'?'Operator':'Faqat ko‘rish'}
function renderLogin(){root.innerHTML=`<div class="login-wrap"><div class="login-hero"><div class="brand-row"><img src="/logo.png"><div><div class="brand-text">All Finance</div><div class="brand-sub">Cash platforma</div></div></div><div class="hero-title">ALL FINANCE <span>CASH</span></div><div class="hero-desc">Korxonalar bo‘yicha ish haqi, qo‘shimcha xizmat, to‘lov, valyuta kursi, davr boshidagi qarz, xarajat va foyda nazorati.</div><div class="hero-grid"><div class="hero-chip"><b>1</b><span>Ish haqi bir marta kiritiladi</span></div><div class="hero-chip"><b>$</b><span>To‘lov kunidagi kurs bilan hisoblanadi</span></div><div class="hero-chip"><b>✓</b><span>Qarzlar avtomatik taqsimlanadi</span></div></div></div><div class="login-card"><div class="brand-row" style="margin-bottom:24px"><img src="/logo.png" style="height:52px"><div><div class="brand-text" style="font-size:24px">ALL FINANCE CASH</div><div class="brand-sub">Login orqali kirish</div></div></div><h2>Platformaga kirish</h2><p>Login va parolingizni kiriting.</p><div class="error" id="loginErr"></div><form id="loginForm"><div class="field"><label>Login</label><input name="login" autocomplete="username" required></div><div class="field"><label>Parol</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">Kirish</button></form></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const out=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});setToken(out.token);S.user=out.user;await loadDashboard()}catch(err){const el=document.getElementById('loginErr');el.textContent=err.message;el.style.display='block'}}}
async function loadDashboard(periodId){try{const q=periodId?'?period_id='+encodeURIComponent(periodId):(S.dash?.selected_period?.id?'?period_id='+encodeURIComponent(S.dash.selected_period.id):'');S.dash=await api('/api/dashboard'+q);if(!S.dash.empty)S.selectedPeriodId=S.dash.selected_period.id;renderApp()}catch(err){if(String(err.message).toLowerCase().includes('token')||String(err.message).includes('Avtorizatsiya')){setToken('');renderLogin();return}root.innerHTML=`<div class="empty"><h2>Xatolik</h2><p>${esc(err.message)}</p><button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div>`}}
function renderApp(){if(!S.token)return renderLogin();if(!S.dash||S.dash.empty)return renderEmpty();const p=S.dash.selected_period;const m=menus.filter(x=>!x[3]||x[3]===S.user?.role).map(x=>`<button class="${S.active===x[0]?'active':''}" data-menu="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');root.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="side-logo"><img src="/logo.png"><div><b>All Finance</b><span>CASH</span></div></div><nav class="menu">${m}</nav><div class="side-user"><div class="avatar">${esc(initials(S.user?.full_name||'A'))}</div><div><b>${esc(S.user?.full_name||'Admin')}</b><span>${esc(roleBadge())}</span></div></div></aside><main class="main"><div class="mobile-top"><button class="btn" data-action="toggleSide">☰ Menyu</button><img src="/logo.png" style="height:42px"></div><div class="topbar"><div class="title"><h1>ALL FINANCE CASH</h1><p>Ish haqi, to‘lov, qo‘shimcha xizmat, xarajat va foyda nazorati ${p.is_closed?'<span class="period-lock">🔒 Davr yopilgan</span>':''}</p></div><div class="actions"><select class="select" id="periodSelect">${periodOptions(S.selectedPeriodId)}</select>${isAdmin()?`<button class="btn ghost" data-action="period">↻ Yangi oy</button>${p.is_closed?'<button class="btn orange" data-action="reopenPeriod">Qayta ochish</button>':'<button class="btn orange" data-action="closePeriod">Davrni yopish</button>'}`:''}${canWrite()&&!p.is_closed?`<button class="btn green" data-action="payment">＋ To‘lov</button><button class="btn primary" data-action="service">＋ Xizmat</button><button class="btn blue" data-action="openingDebt">＋ Davr boshiga qarz</button><button class="btn primary" data-action="expense">⇧ Xarajat</button>`:''}<button class="btn" data-action="logout">Chiqish</button></div></div>${renderCurrentPage()}</main></div>`;bindStatic()}
function renderEmpty(){root.innerHTML=`<div class="empty"><img src="/logo.png" style="height:90px"><h2>ALL FINANCE CASH</h2><p>Hali oy yaratilmagan. Birinchi oyni yarating.</p>${isAdmin()?'<button class="btn primary" data-action="period">Yangi oy yaratish</button>':''}<button class="btn" data-action="logout">Chiqish</button></div>`;bindStatic()}
function bindStatic(){document.getElementById('periodSelect')?.addEventListener('change',e=>loadDashboard(e.target.value));document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>switchPage(b.dataset.menu));const search=document.getElementById('tableSearch');if(search)search.oninput=e=>{S.search=e.target.value;renderApp()}}
async function switchPage(p){S.active=p;if(p==='users'&&isAdmin())S.users=await api('/api/users');if(p==='audit'&&isAdmin())S.audit=await api('/api/audit-logs');renderApp()}
function renderCurrentPage(){if(S.active==='dashboard')return renderDashboard();if(S.active==='companies')return renderCompaniesPage();if(S.active==='monthly')return renderDashboard();if(S.active==='payments')return renderPaymentsPage();if(S.active==='services')return renderServicesPage();if(S.active==='expenses')return renderExpensesPage();if(S.active==='debts')return renderDebtsPage();if(S.active==='reports')return renderReportsPage();if(S.active==='users')return renderUsersPage();if(S.active==='audit')return renderAuditPage();return renderSettingsPage()}
function renderDashboard(){const t=S.dash.totals;return `<section class="grid4">${kpi('↓','Jami tushum',t.total_paid,'so‘m','Haqiqiy tushgan to‘lovlar','green')}${kpi('↑','Jami xarajat',t.total_expenses,'so‘m','Tanlangan oy xarajatlari','red')}${kpi('▣','Real foyda',t.real_profit,'so‘m','Tushum - xarajat','blue')}${kpi('◉','Jami qarz',t.total_debt,'so‘m','Oldingi + joriy qarz','orange')}</section><div class="layout"><div>${renderCompanyTable(true)}${renderBottomCharts()}</div><div>${renderLatestPayments()}${renderLatestServices()}${renderLatestExpenses()}</div></div>`}
function filterCompanies(){const q=String(S.search||'').toLowerCase();return (S.dash.companies||[]).filter(r=>!q||[r.company_name,r.stir,r.director_name,r.phone].join(' ').toLowerCase().includes(q))}
function renderCompanyTable(compact){const rows=filterCompanies();return `<div class="panel"><div class="panel-head"><h3>Korxonalar bo‘yicha ish haqi va to‘lovlar holati</h3><div class="search"><input id="tableSearch" placeholder="Qidirish..." value="${esc(S.search)}">${isAdmin()?'<button class="btn primary" data-action="company">＋ Korxona</button>':''}<button class="btn" data-action="exportMonthlyCsv">Excel CSV</button></div></div><div class="table-wrap desktop-table"><table class="table"><thead><tr><th>Korxona</th><th>STIR</th><th>Rahbar</th><th>Telefon</th><th>Ish haqi</th><th>Xizmat</th><th>To‘langan</th><th>Oldingi qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Amal</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td>${esc(r.stir||'')}</td><td>${esc(r.director_name||'')}</td><td>${esc(r.phone||'')}</td><td><b>${fmt(r.salary_sum)}</b></td><td class="brand-text2">${fmt(r.services_sum)}</td><td class="green-text"><b>${fmt(r.paid_sum)}</b></td><td><button class="linkish orange-text" data-debt="${r.company_id}">${fmt(r.previous_debt)}</button></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-card="${r.company_id}">Kartochka</button>${isAdmin()?`<button class="btn small" data-salary="${r.company_id}">Maosh</button><button class="btn small" data-history="${r.company_id}">Tarix</button><button class="btn small" data-company-edit="${r.company_id}">Edit</button><button class="btn small red" data-company-del="${r.company_id}">Arxiv</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="12" class="empty">Korxona topilmadi</td></tr>`}</tbody></table></div><div class="cards-mobile">${rows.map(r=>`<div class="panel-body" style="border-bottom:1px solid var(--line)"><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div><p class="muted">STIR: ${esc(r.stir||'')} • ${esc(r.phone||'')}</p><div class="grid4" style="grid-template-columns:repeat(2,1fr);margin:10px 0">${kpi('₮','Ish haqi',r.salary_sum,'','', 'green')}${kpi('◉','Jami qarz',r.total_debt,'','', 'orange')}</div><button class="btn small" data-card="${r.company_id}">Kartochka</button></div>`).join('')}</div></div>`}
function listPanel(title,rows,icon,cls,titleFn,subFn,amountFn,dateFn){return `<div class="panel"><div class="panel-head"><h3>${title}</h3></div><div class="panel-body"><div class="side-list">${(rows||[]).map(x=>`<div class="list-item"><div class="round ${cls}">${icon}</div><div><div class="li-title">${titleFn(x)}</div><div class="li-sub">${subFn(x)}</div></div><div><div class="li-amount ${cls==='red'?'red-text':'green-text'}">${fmt(amountFn(x))}</div><div class="li-date">${esc(dateFn(x)||'')}</div></div></div>`).join('')||'<div class="empty">Ma’lumot yo‘q</div>'}</div></div></div>`}
function renderLatestPayments(){return listPanel('So‘nggi to‘lovlar',S.dash.latest_payments,'↓','green',x=>esc(x.company_name),x=>esc(x.payment_type||'to‘lov'),x=>x.amount_sum,x=>x.payment_date)}function renderLatestServices(){return listPanel('Qo‘shimcha xizmatlar',S.dash.latest_services,'+','blue',x=>esc(x.company_name),x=>esc(x.service_name),x=>x.amount_sum,x=>x.service_date)}function renderLatestExpenses(){return listPanel('So‘nggi xarajatlar',S.dash.latest_expenses,'↑','red',x=>esc(x.expense_type),x=>esc(x.paid_to||'xarajat'),x=>x.amount_sum,x=>x.expense_date)}
function renderBottomCharts(){const t=S.dash.totals;return `<div class="bottom"><div class="panel"><div class="panel-head"><h3>Foyda ko‘rsatkichi</h3><button class="btn small" data-action="exportMonthlyCsv">Excel CSV</button></div><div class="panel-body">${renderSvgChart()}</div></div><div class="panel"><div class="panel-head"><h3>Qarzlar holati</h3></div><div class="panel-body" style="text-align:center;--oldPct:${t.total_debt?Math.round(t.old_debt/t.total_debt*100):0}%"><div class="debt-donut"><div class="donut-inner">Jami qarz<b>${fmt(t.total_debt)}</b>so‘m</div></div><p><span class="orange-text"><b>Oldingi:</b> ${fmt(t.old_debt)}</span></p><p><span class="red-text"><b>Joriy:</b> ${fmt(t.current_debt)}</span></p><p><span class="brand-text2"><b>Davr boshidagi qarz:</b> ${fmt(t.total_opening_debt)}</span></p></div></div></div>`}
function renderSvgChart(){const data=S.dash.chart||[];const max=Math.max(1,...data.flatMap(x=>[x.income,x.paid,x.expenses,Math.abs(x.profit)]));const W=760,H=220,pad=28;function pts(key){return data.map((d,i)=>`${pad+i*((W-pad*2)/Math.max(data.length-1,1))},${H-pad-(Number(d[key]||0)/max)*(H-pad*2)}`).join(' ')}return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00a85a" stop-opacity=".20"/><stop offset="1" stop-color="#00a85a" stop-opacity="0"/></linearGradient></defs><polyline points="${pts('income')}" fill="none" stroke="#00a85a" stroke-width="4"/><polyline points="${pts('expenses')}" fill="none" stroke="#ef3340" stroke-width="4"/><polyline points="${pts('profit')}" fill="none" stroke="#403f98" stroke-width="4"/>${data.map((d,i)=>`<text x="${pad+i*((W-pad*2)/Math.max(data.length-1,1))}" y="${H-6}" font-size="12" text-anchor="middle" fill="#657089">${esc(d.label)}</text>`).join('')}<text x="${pad}" y="18" font-size="13" fill="#00a85a">Tushum</text><text x="${pad+85}" y="18" font-size="13" fill="#ef3340">Xarajat</text><text x="${pad+175}" y="18" font-size="13" fill="#403f98">Foyda</text></svg>`}
function renderCompaniesPage(){const t=S.dash.totals;return `<section class="grid4">${kpi('▥','Korxonalar',t.companies_count,'ta','Faol korxonalar','blue')}${kpi('₮','Jami ish haqi',t.total_salary,'so‘m','Har oy takrorlanadi','green')}${kpi('+','Qo‘shimcha xizmat',t.total_services,'so‘m','Alohida xizmatlar','green')}${kpi('◉','Jami qarz',t.total_debt,'so‘m','Barcha qarzlar','orange')}</section>${renderCompanyTable(false)}`}
function renderPaymentsPage(){const rows=S.dash.payments||[];return `<div class="panel"><div class="panel-head"><h3>To‘lovlar</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn green" data-action="payment">＋ To‘lov qo‘shish</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Taqsimot</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.payment_date)}</td><td>${esc(x.company_name)}</td><td>${esc(x.payment_type)}</td><td class="green-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.allocation_summary||x.payment_scope||'')}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<div style="display:flex;gap:6px"><button class="btn small" data-payment-edit="${x.id}">Edit</button>${isAdmin()?`<button class="btn small red" data-payment-del="${x.id}">O‘chirish</button>`:''}</div>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">To‘lov yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderServicesPage(){const rows=S.dash.services||[];return `<div class="panel"><div class="panel-head"><h3>Qo‘shimcha xizmatlar</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn primary" data-action="service">＋ Xizmat qo‘shish</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Xizmat</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.service_date)}</td><td>${esc(x.company_name)}</td><td>${esc(x.service_name)}</td><td class="brand-text2"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<div style="display:flex;gap:6px"><button class="btn small" data-service-edit="${x.id}">Edit</button>${isAdmin()?`<button class="btn small red" data-service-del="${x.id}">O‘chirish</button>`:''}</div>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">Qo‘shimcha xizmat yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderExpensesPage(){const rows=S.dash.expenses||[];return `<div class="panel"><div class="panel-head"><h3>Xarajatlar</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn primary" data-action="expense">＋ Xarajat qo‘shish</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Turi</th><th>Kimga</th><th>To‘lov turi</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.expense_type)}</td><td>${esc(x.paid_to)}</td><td>${esc(x.payment_type)}</td><td class="red-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<div style="display:flex;gap:6px"><button class="btn small" data-expense-edit="${x.id}">Edit</button>${isAdmin()?`<button class="btn small red" data-expense-del="${x.id}">O‘chirish</button>`:''}</div>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">Xarajat yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderDebtsPage(){const rows=S.dash.companies.filter(x=>x.total_debt>0);const opening=S.dash.opening_debts||[];return `<div class="panel"><div class="panel-head"><h3>Qarzlar nazorati</h3>${canWrite()&&!S.dash.selected_period.is_closed?'<button class="btn blue" data-action="openingDebt">＋ Davr boshiga qarz</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Korxona</th><th>Davr boshidagi qarz</th><th>Oldingi qarz</th><th>Joriy qarz</th><th>Jami qarz</th><th>Holat</th><th>Tafsilot</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="company-cell"><span class="mini-logo">${initials(r.company_name)}</span>${esc(r.company_name)}</div></td><td class="brand-text2"><b>${fmt(r.opening_debt_remaining)}</b></td><td class="orange-text"><b>${fmt(r.previous_debt)}</b></td><td class="red-text"><b>${fmt(r.current_debt)}</b></td><td class="red-text"><b>${fmt(r.total_debt)}</b></td><td>${statusPill(r.status)}</td><td><button class="btn small" data-debt="${r.company_id}">Ko‘rish</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Qarz yo‘q</td></tr>`}</tbody></table></div></div><div class="panel"><div class="panel-head"><h3>Davr boshiga kiritilgan qarzlar</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Sana</th><th>Korxona</th><th>Summa</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Amal</th></tr></thead><tbody>${opening.map(x=>`<tr><td>${esc(x.debt_date)}</td><td>${esc(x.company_name)}</td><td class="orange-text"><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.comment||'')}</td><td>${canWrite()?`<button class="btn small" data-opening-edit="${x.id}">Edit</button> ${isAdmin()?`<button class="btn small red" data-opening-del="${x.id}">O‘chirish</button>`:''}`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">Davr boshidagi qarz yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderReportsPage(){const t=S.dash.totals;return `<section class="grid4">${kpi('₮','Hisoblangan foyda',t.calculated_profit,'so‘m','Hisoblangan tushum - xarajat','green')}${kpi('▣','Real foyda',t.real_profit,'so‘m','Tushgan to‘lov - xarajat','blue')}${kpi('+','Xizmat tushumi',t.total_services,'so‘m','Qo‘shimcha xizmatlar','green')}${kpi('◉','Qarzlar',t.total_debt,'so‘m','Undirilmagan summa','orange')}</section>${renderBottomCharts()}<div class="panel"><div class="panel-head"><h3>Eksport</h3></div><div class="panel-body"><button class="btn" data-action="exportMonthlyCsv">Oylik hisobotni Excel CSV</button> <button class="btn" data-action="exportCompaniesCsv">Korxonalar shablonini Excel CSV</button> <button class="btn" data-action="exportJson">JSON backup</button></div></div>`}
function renderUsersPage(){if(!isAdmin())return '<div class="empty">Ruxsat yo‘q</div>';const rows=S.users?.users||[];return `<div class="panel"><div class="panel-head"><h3>Foydalanuvchilar</h3><button class="btn primary" data-action="user">＋ Foydalanuvchi</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Login</th><th>F.I.Sh.</th><th>Rol</th><th>Holat</th><th>Yaratilgan</th><th>Amal</th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc(u.login)}</b></td><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td><td>${u.is_active?'Faol':'O‘chirilgan'}</td><td>${esc(String(u.created_at||'').slice(0,16).replace('T',' '))}</td><td><button class="btn small" data-user-edit="${u.id}">Edit</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Foydalanuvchi yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderAuditPage(){if(!isAdmin())return '<div class="empty">Ruxsat yo‘q</div>';const rows=S.audit?.logs||[];return `<div class="panel"><div class="panel-head"><h3>Audit log</h3><button class="btn" data-action="refreshAudit">Yangilash</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Vaqt</th><th>User</th><th>Rol</th><th>Action</th><th>Jadval</th><th>Izoh</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(String(x.created_at||'').slice(0,19).replace('T',' '))}</td><td>${esc(x.user_login||'')}</td><td>${esc(x.user_role||'')}</td><td><b>${esc(x.action)}</b></td><td>${esc(x.table_name)}</td><td>${esc(x.note||'')}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">Audit log yo‘q</td></tr>`}</tbody></table></div></div>`}
function renderSettingsPage(){return `<div class="setup-card"><h3>Sozlamalar</h3><p>Ma’lumotlar Supabase bazasida saqlanadi. Tilda sahifasiga iframe qisqa kodi qo‘yiladi.</p><p><b>Joriy rol:</b> ${esc(roleBadge())}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-action="exportJson">JSON backup olish</button><button class="btn" data-action="exportMonthlyCsv">Oylik Excel CSV</button><button class="btn" data-action="exportCompaniesCsv">Korxonalar CSV shablon</button><button class="btn red" data-action="logout">Chiqish</button></div>${isAdmin()?`<div class="file"><h4>Korxonalarni CSV orqali import qilish</h4><p class="muted">Ustunlar: name, stir, director_name, phone, salary_sum, salary_usd, exchange_rate, effective_from, opening_debt_sum, opening_debt_usd, opening_debt_rate, opening_debt_comment.</p><input type="file" id="csvFile" accept=".csv,text/csv"> <button class="btn primary" data-action="importCompanies">Import qilish</button><div id="importResult" class="muted" style="margin-top:10px"></div></div>`:''}<h4>Tilda qisqa kod namunasi</h4><div class="code">&lt;iframe src=&quot;https://YOUR-RENDER-URL.onrender.com&quot; style=&quot;width:100%;height:920px;border:0;border-radius:18px;overflow:hidden&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;</div><h4>Migratsiya eslatmasi</h4><p class="muted">Bu patch uchun Supabase SQL Editor’da <b>database/004_stage1_3_final.sql</b> faylini bir marta ishga tushiring.</p></div>`}
function openModal(title,body,onSubmit){modalRoot.style.display='flex';modalRoot.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" id="modalClose">×</button></div><form id="modalForm"><div class="modal-body"><div class="error" id="modalErr"></div>${body}</div><div class="modal-foot"><button type="button" class="btn" id="modalCancel">Bekor qilish</button><button class="btn primary" type="submit">Saqlash</button></div></form></div>`;const close=()=>{modalRoot.style.display='none';modalRoot.innerHTML=''};document.getElementById('modalClose').onclick=close;document.getElementById('modalCancel').onclick=close;document.getElementById('modalForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const obj=Object.fromEntries(fd);try{await onSubmit(obj);close();S.users=null;S.audit=null;await loadDashboard(S.selectedPeriodId)}catch(err){const el=document.getElementById('modalErr');el.textContent=err.message;el.style.display='block'}}}
function openPeriodModal(){const d=new Date();openModal('Yangi oy yaratish',`<div class="form-grid">${input('year','Yil','number',d.getFullYear(),true)}${input('month','Oy raqami','number',d.getMonth()+1,true,'min="1" max="12"')}${input('default_usd_rate','Standart dollar kursi','number','',false,'step="0.01"')}${input('period_name','Davr nomi','text','',false)}</div>`,obj=>api('/api/periods',{method:'POST',body:JSON.stringify(obj)}))}
function openCompanyModal(id){const r=S.dash.companies.find(x=>x.company_id===id)||{};openModal(id?'Korxonani tahrirlash':'Korxona qo‘shish',`<div class="form-grid">${input('name','Korxona nomi','text',r.company_name||'',true)}${input('stir','STIR','text',r.stir||'')}${input('director_name','Rahbar F.I.Sh.','text',r.director_name||'')}${input('phone','Telefon','text',r.phone||'')}${!id?input('salary_sum','Oylik ish haqi so‘mda','number','',false,'step="0.01"'):''}${!id?input('salary_usd','Oylik ish haqi USD','number','',false,'step="0.01"'):''}${!id?input('exchange_rate','Kurs','number','',false,'step="0.01"'):''}${!id?input('effective_from','Qaysi sanadan','date',today(),true):''}${textarea('note','Izoh',r.note||'')}</div>`,obj=>id?api('/api/companies/'+id,{method:'PUT',body:JSON.stringify(obj)}):api('/api/companies',{method:'POST',body:JSON.stringify(obj)}))}
function openSalaryModal(id){const r=S.dash.companies.find(x=>x.company_id===id)||{};openModal('Ish haqi summasini o‘zgartirish',`<p><b>${esc(r.company_name)}</b> uchun yangi summa. O‘zgarish tarixi alohida saqlanadi.</p><div class="form-grid">${input('amount_sum','Yangi summa so‘mda','number',r.salary_sum||'',false,'step="0.01"')}${input('amount_usd','Yangi summa USD','number',r.salary_usd||'',false,'step="0.01"')}${input('exchange_rate','Valyuta kursi','number','',false,'step="0.01"')}${input('effective_from','Qaysi sanadan amal qiladi','date',today(),true)}${textarea('note','O‘zgarish sababi / izohi','')}</div>`,obj=>api('/api/companies/'+id+'/salary-rate',{method:'POST',body:JSON.stringify(obj)}))}
function openPaymentModal(id){const r=(S.dash.payments||[]).find(x=>x.id===id)||{};openModal(id?'To‘lovni tahrirlash':'To‘lov qo‘shish',`<div class="form-grid"><div class="field"><label>Korxona</label><select name="company_id" required>${companyOptions(r.company_id||'')}</select></div><div class="field"><label>Qaysi davrgacha taqsimlash</label><select name="period_id" required>${periodOptions(r.period_id||S.selectedPeriodId)}</select></div>${input('payment_date','To‘lov sanasi','date',r.payment_date||today(),true)}${select('payment_type','To‘lov turi',payTypes,r.payment_type||'')}${input('amount_sum','Summa so‘mda','number',r.amount_sum||'',false,'step="0.01"')}${input('amount_usd','Summa USD','number',r.amount_usd||'',false,'step="0.01"')}${input('exchange_rate','To‘lov kunidagi valyuta kursi','number',r.exchange_rate||'',false,'step="0.01"')}${select('payment_scope','Taqsimlash turi',payScopes,r.payment_scope||payScopes[0])}${textarea('comment','Izoh',r.comment||'')}</div><p class="muted">Standart holatda to‘lov avval eng eski qarzlarni yopadi, keyin joriy oyga o‘tadi.</p>`,obj=>api('/api/payments'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)}))}
function openServiceModal(id){const r=(S.dash.services||[]).find(x=>x.id===id)||{};openModal(id?'Qo‘shimcha xizmatni tahrirlash':'Qo‘shimcha xizmat qo‘shish',`<div class="form-grid"><div class="field"><label>Korxona</label><select name="company_id" required>${companyOptions(r.company_id||'')}</select></div><div class="field"><label>Davr</label><select name="period_id" required>${periodOptions(r.period_id||S.selectedPeriodId)}</select></div>${input('service_date','Xizmat sanasi','date',r.service_date||today(),true)}${input('service_name','Xizmat nomi','text',r.service_name||'',true)}${input('amount_sum','Xizmat summasi so‘mda','number',r.amount_sum||'',false,'step="0.01"')}${input('amount_usd','Xizmat summasi USD','number',r.amount_usd||'',false,'step="0.01"')}${input('exchange_rate','Xizmat kunidagi valyuta kursi','number',r.exchange_rate||'',false,'step="0.01"')}${textarea('comment','Izoh',r.comment||'')}</div>`,obj=>api('/api/services'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)}))}
function openExpenseModal(id){const r=(S.dash.expenses||[]).find(x=>x.id===id)||{};openModal(id?'Xarajatni tahrirlash':'Xarajat qo‘shish',`<div class="form-grid"><div class="field"><label>Davr</label><select name="period_id" required>${periodOptions(r.period_id||S.selectedPeriodId)}</select></div>${select('expense_type','Xarajat turi',expTypes,r.expense_type||'')}${input('expense_date','Xarajat sanasi','date',r.expense_date||today(),true)}${input('paid_to','Kimga to‘landi','text',r.paid_to||'')}${select('payment_type','To‘lov turi',payTypes,r.payment_type||'')}${input('amount_sum','Summa so‘mda','number',r.amount_sum||'',false,'step="0.01"')}${input('amount_usd','Summa USD','number',r.amount_usd||'',false,'step="0.01"')}${input('exchange_rate','Xarajat kunidagi valyuta kursi','number',r.exchange_rate||'',false,'step="0.01"')}${textarea('comment','Izoh',r.comment||'')}</div>`,obj=>api('/api/expenses'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)}))}
function openOpeningDebtModal(id){const r=(S.dash.opening_debts||[]).find(x=>x.id===id)||{};openModal(id?'Davr boshidagi qarzni tahrirlash':'Davr boshiga qarz kiritish',`<div class="form-grid"><div class="field"><label>Korxona</label><select name="company_id" required>${companyOptions(r.company_id||'')}</select></div><div class="field"><label>Davr</label><select name="period_id" required>${periodOptions(r.period_id||S.selectedPeriodId)}</select></div>${input('debt_date','Qarz sanasi','date',r.debt_date||monthStart(),true)}${input('amount_sum','Qarz summasi so‘mda','number',r.amount_sum||'',false,'step="0.01"')}${input('amount_usd','Qarz summasi USD','number',r.amount_usd||'',false,'step="0.01"')}${input('exchange_rate','Kurs','number',r.exchange_rate||'',false,'step="0.01"')}${textarea('comment','Izoh',r.comment||'')}</div>`,obj=>api('/api/opening-debts'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)}))}
function openUserModal(id){const r=(S.users?.users||[]).find(x=>x.id===id)||{};openModal(id?'Foydalanuvchini tahrirlash':'Foydalanuvchi qo‘shish',`<div class="form-grid">${input('login','Login','text',r.login||'',true)}${input('full_name','F.I.Sh.','text',r.full_name||'')}${select('role','Rol',[['admin','Admin'],['operator','Operator'],['viewer','Faqat ko‘rish']],r.role||'viewer')}${select('is_active','Holat',[['true','Faol'],['false','O‘chirilgan']],String(r.is_active!==false))}${input('password',id?'Yangi parol (bo‘sh qoldirilsa o‘zgarmaydi)':'Parol','password','',!id)}</div>`,async obj=>{await api('/api/users'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(obj)});S.users=await api('/api/users')})}
async function openDebtDetails(id){try{const out=await api('/api/companies/'+id+'/debt-details?period_id='+encodeURIComponent(S.selectedPeriodId));const comp=S.dash.companies.find(x=>x.company_id===id)||{};modalRoot.style.display='flex';modalRoot.innerHTML=`<div class="modal"><div class="modal-head"><h3>Oldingi qarz tafsiloti — ${esc(comp.company_name)}</h3><button class="x" id="modalClose">×</button></div><div class="modal-body"><div class="table-wrap"><table class="table"><thead><tr><th>Davr</th><th>Davr boshi qarzi</th><th>Ish haqi</th><th>Xizmat</th><th>Majburiyat</th><th>To‘langan</th><th>Qoldiq</th></tr></thead><tbody>${(out.items||[]).map(x=>`<tr><td>${esc(x.period_name)}</td><td>${fmt(x.opening_debt_sum)}</td><td>${fmt(x.salary_sum)}</td><td>${fmt(x.services_sum)}</td><td>${fmt(x.obligation_sum)}</td><td class="green-text">${fmt(x.paid_sum)}</td><td class="red-text"><b>${fmt(x.debt_sum)}</b></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Oldingi qarz yo‘q</td></tr>`}</tbody></table></div></div><div class="modal-foot"><button class="btn" id="modalCancel">Yopish</button></div></div>`;document.getElementById('modalClose').onclick=document.getElementById('modalCancel').onclick=()=>{modalRoot.style.display='none';modalRoot.innerHTML=''}}catch(err){alert(err.message)}}
async function openSalaryHistory(id){try{const out=await api('/api/companies/'+id+'/salary-history');const comp=S.dash.companies.find(x=>x.company_id===id)||{};modalRoot.style.display='flex';modalRoot.innerHTML=`<div class="modal"><div class="modal-head"><h3>Ish haqi tarixi — ${esc(comp.company_name)}</h3><button class="x" id="modalClose">×</button></div><div class="modal-body"><div class="table-wrap"><table class="table"><thead><tr><th>Qaysi sanadan</th><th>Summa so‘m</th><th>USD</th><th>Kurs</th><th>Izoh</th><th>Kiritilgan vaqt</th></tr></thead><tbody>${(out.history||[]).map(x=>`<tr><td>${esc(x.effective_from)}</td><td><b>${fmt(x.amount_sum)}</b></td><td>${fmt2(x.amount_usd)}</td><td>${fmt2(x.exchange_rate)}</td><td>${esc(x.note||'')}</td><td>${esc(String(x.created_at||'').slice(0,16).replace('T',' '))}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">Tarix yo‘q</td></tr>`}</tbody></table></div></div><div class="modal-foot"><button class="btn" id="modalCancel">Yopish</button></div></div>`;document.getElementById('modalClose').onclick=document.getElementById('modalCancel').onclick=()=>{modalRoot.style.display='none';modalRoot.innerHTML=''}}catch(err){alert(err.message)}}
async function openCompanyCard(id){try{const out=await api('/api/companies/'+id+'/card?period_id='+encodeURIComponent(S.selectedPeriodId));const c=out.company;modalRoot.style.display='flex';modalRoot.innerHTML=`<div class="modal"><div class="modal-head"><h3>Korxona kartochkasi — ${esc(c.name)}</h3><button class="x" id="modalClose">×</button></div><div class="modal-body"><section class="grid4">${kpi('▥','STIR',c.stir||'-','','','blue')}${kpi('☎','Telefon',c.phone||'-','','','green')}${kpi('👤','Rahbar',c.director_name||'-','','','blue')}${kpi('◉','Status',c.status||'-','','','orange')}</section><div class="tabs"><span class="tab">Davrlar</span><span class="tab">To‘lovlar</span><span class="tab">Xizmatlar</span><span class="tab">Maosh tarixi</span></div><h4>Davrlar bo‘yicha holat</h4><div class="table-wrap"><table class="table"><thead><tr><th>Davr</th><th>Davr boshi qarzi</th><th>Ish haqi</th><th>Xizmat</th><th>To‘langan</th><th>Qoldiq</th></tr></thead><tbody>${out.rows.map(r=>`<tr><td>${esc(r.period_name)}${r.is_closed?' 🔒':''}</td><td>${fmt(r.opening_debt_remaining)}</td><td>${fmt(r.salary_sum)}</td><td>${fmt(r.services_sum)}</td><td class="green-text">${fmt(r.paid_sum)}</td><td class="red-text"><b>${fmt(r.debt_sum)}</b></td></tr>`).join('')}</tbody></table></div><h4>To‘lovlar</h4><div class="table-wrap"><table class="table"><tbody>${out.payments.map(p=>`<tr><td>${esc(p.payment_date)}</td><td>${esc(p.payment_type)}</td><td class="green-text"><b>${fmt(p.amount_sum)}</b></td><td>${esc(p.allocation_summary||'')}</td><td>${esc(p.comment||'')}</td></tr>`).join('')||'<tr><td class="empty">To‘lov yo‘q</td></tr>'}</tbody></table></div><h4>Qo‘shimcha xizmatlar</h4><div class="table-wrap"><table class="table"><tbody>${out.services.map(s=>`<tr><td>${esc(s.service_date)}</td><td>${esc(s.service_name)}</td><td class="brand-text2"><b>${fmt(s.amount_sum)}</b></td><td>${esc(s.comment||'')}</td></tr>`).join('')||'<tr><td class="empty">Xizmat yo‘q</td></tr>'}</tbody></table></div></div><div class="modal-foot"><button class="btn" id="modalCancel">Yopish</button></div></div>`;document.getElementById('modalClose').onclick=document.getElementById('modalCancel').onclick=()=>{modalRoot.style.display='none';modalRoot.innerHTML=''}}catch(err){alert(err.message)}}
async function deleteRecord(type,id,msg){if(!confirm(msg||'O‘chirilsinmi?'))return;try{await api('/api/'+type+'/'+id,{method:'DELETE'});await loadDashboard(S.selectedPeriodId)}catch(err){alert(err.message)}}
async function exportJson(){try{const data=await api('/api/export/json');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='all_finance_cash_backup_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}catch(err){alert(err.message)}}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'){if(q&&nx==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[]}else cell+=ch}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);const head=(rows.shift()||[]).map(x=>x.trim());return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}
async function importCompanies(){const input=document.getElementById('csvFile');const out=document.getElementById('importResult');if(!input?.files?.[0]){alert('CSV fayl tanlang');return}const text=await input.files[0].text();const rows=parseCSV(text);try{const res=await api('/api/import/companies',{method:'POST',body:JSON.stringify({period_id:S.selectedPeriodId,rows})});out.textContent=`Import tugadi: yangi ${res.created}, yangilangan ${res.updated}, maosh ${res.salary_rates}, davr boshidagi qarz ${res.opening_debts}, xato ${res.errors.length}`;await loadDashboard(S.selectedPeriodId)}catch(err){out.textContent=err.message}}
async function handleAction(action){try{if(action==='toggleSide')document.getElementById('sidebar')?.classList.toggle('open');if(action==='period')openPeriodModal();if(action==='company')openCompanyModal();if(action==='payment')openPaymentModal();if(action==='service')openServiceModal();if(action==='expense')openExpenseModal();if(action==='openingDebt')openOpeningDebtModal();if(action==='user')openUserModal();if(action==='logout'){setToken('');renderLogin()}if(action==='exportJson')exportJson();if(action==='exportMonthlyCsv')downloadAuth('/api/export/monthly.csv?period_id='+encodeURIComponent(S.selectedPeriodId),'all_finance_cash_monthly.csv');if(action==='exportCompaniesCsv')downloadAuth('/api/export/companies.csv','all_finance_cash_companies.csv');if(action==='importCompanies')importCompanies();if(action==='closePeriod'&&confirm('Davr yopilsinmi? Yopilgan davrga o‘zgartirish kiritib bo‘lmaydi.')){await api('/api/periods/'+S.selectedPeriodId+'/close',{method:'PUT'});await loadDashboard(S.selectedPeriodId)}if(action==='reopenPeriod'&&confirm('Davr qayta ochilsinmi?')){await api('/api/periods/'+S.selectedPeriodId+'/reopen',{method:'PUT'});await loadDashboard(S.selectedPeriodId)}if(action==='refreshAudit'){S.audit=await api('/api/audit-logs');renderApp()}}catch(err){alert(err.message)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)return handleAction(b.dataset.action);if(b.dataset.card)return openCompanyCard(b.dataset.card);if(b.dataset.debt)return openDebtDetails(b.dataset.debt);if(b.dataset.salary)return openSalaryModal(b.dataset.salary);if(b.dataset.history)return openSalaryHistory(b.dataset.history);if(b.dataset.companyEdit)return openCompanyModal(b.dataset.companyEdit);if(b.dataset.companyDel)return deleteRecord('companies',b.dataset.companyDel,'Korxonani arxivga o‘tkazaymi?');if(b.dataset.paymentEdit)return openPaymentModal(b.dataset.paymentEdit);if(b.dataset.paymentDel)return deleteRecord('payments',b.dataset.paymentDel,'To‘lovni o‘chiraymi?');if(b.dataset.serviceEdit)return openServiceModal(b.dataset.serviceEdit);if(b.dataset.serviceDel)return deleteRecord('services',b.dataset.serviceDel,'Qo‘shimcha xizmatni o‘chiraymi?');if(b.dataset.expenseEdit)return openExpenseModal(b.dataset.expenseEdit);if(b.dataset.expenseDel)return deleteRecord('expenses',b.dataset.expenseDel,'Xarajatni o‘chiraymi?');if(b.dataset.openingEdit)return openOpeningDebtModal(b.dataset.openingEdit);if(b.dataset.openingDel)return deleteRecord('opening-debts',b.dataset.openingDel,'Davr boshidagi qarzni o‘chiraymi?');if(b.dataset.userEdit)return openUserModal(b.dataset.userEdit)});
async function boot(){if(!S.token){renderLogin();return}try{const me=await api('/api/auth/me');S.user=me.user;await loadDashboard()}catch(e){setToken('');renderLogin()}}
boot();
})();
</script>
