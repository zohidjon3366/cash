<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALL FINANCE Setup</title><style>:root{--brand:#3F3CBB;--brand-dark:#2D2A86;--green:#0FA76A;--text:#111827;--muted:#64748B;--line:#E6EAF2;--bg:#F6F8FC}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(63,60,187,.09),transparent 32%),linear-gradient(180deg,#FBFCFF,#F5F7FB);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);padding:18px}.card{width:min(500px,94vw);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 38px rgba(17,24,39,.08);padding:28px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.brand img{height:50px}.brand b{display:block;font-size:20px;color:var(--brand-dark);letter-spacing:-.035em}.brand span{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:3px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}label{font-size:12px;font-weight:800;color:#334155}input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:#FBFCFF;outline:none}input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(63,60,187,.09)}.btn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;font-weight:850;padding:13px 16px;width:100%;cursor:pointer;margin-top:4px}.msg{margin-top:14px;padding:12px;border-radius:12px;display:none}.ok{background:#effcf5;color:#007947;border:1px solid #b9f2d5}.err{background:#fff4f5;color:#d51d2a;border:1px solid #ffd2d6}</style></head><body><div class="card"><div class="brand"><img src="/logo.png"><div><b>ALL FINANCE</b><span>Cash Platform admin sozlash</span></div></div><form id="f"><div class="field"><label>Setup token</label><input name="setup_token" required placeholder="ADMIN_SETUP_TOKEN"></div><div class="field"><label>Login</label><input name="login" required value="admin"></div><div class="field"><label>Parol</label><input name="password" type="password" required placeholder="kamida 8 ta belgi"></div><div class="field"><label>F.I.Sh.</label><input name="full_name" value="Super Admin"></div><button class="btn">Admin yaratish</button></form><div class="msg" id="m"></div></div><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const m=document.getElementById('m');m.style.display='none';try{const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/setup/create-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Xatolik');m.className='msg ok';m.textContent='Admin yaratildi. Endi asosiy sahifaga kirib login qiling.';m.style.display='block';}catch(err){m.className='msg err';m.textContent=err.message;m.style.display='block';}}</script></body></html>
