<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALL FINANCE CASH Setup</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fc;font-family:Segoe UI,Arial,sans-serif;color:#0f1733}.card{width:min(520px,94vw);background:#fff;border:1px solid #e7eaf3;border-radius:24px;box-shadow:0 18px 45px rgba(25,32,70,.10);padding:28px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}.brand img{height:54px}.brand b{font-size:24px;color:#403f98}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}input{border:1px solid #e7eaf3;border-radius:14px;padding:13px;font:inherit}.btn{border:0;border-radius:14px;background:#403f98;color:#fff;font-weight:800;padding:14px 16px;width:100%;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:12px;display:none}.ok{background:#effcf5;color:#007947;border:1px solid #b9f2d5}.err{background:#fff4f5;color:#d51d2a;border:1px solid #ffd2d6}</style></head><body><div class="card"><div class="brand"><img src="/logo.png"><div><b>ALL FINANCE CASH</b><div>Admin yaratish</div></div></div><form id="f"><div class="field"><label>Setup token</label><input name="setup_token" required placeholder="ADMIN_SETUP_TOKEN"></div><div class="field"><label>Login</label><input name="login" required value="admin"></div><div class="field"><label>Parol</label><input name="password" type="password" required placeholder="kamida 8 ta belgi"></div><div class="field"><label>F.I.Sh.</label><input name="full_name" value="Super Admin"></div><button class="btn">Admin yaratish</button></form><div class="msg" id="m"></div></div><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const m=document.getElementById('m');m.style.display='none';try{const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/setup/create-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Xatolik');m.className='msg ok';m.textContent='Admin yaratildi. Endi asosiy sahifaga kirib login qiling.';m.style.display='block';}catch(err){m.className='msg err';m.textContent=err.message;m.style.display='block';}}</script></body></html>
